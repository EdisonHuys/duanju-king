      applySimPreset(endingType) {
        const s = state.editingScript;
        if (!s || !Array.isArray(s.episodes)) return;
        const endings = s.endings || [];
        const eps = s.episodes;

        // 优先搜索能真实触发目标结局的路径（小规模束搜索，兼顾任意剧本数值配置）
        let bestPath = null;
        const scoreCandidate = (path) => {
          const res = evaluateMindMapSimPath(s, path);
          const hit = res.matchedEnding && res.matchedEnding.type === endingType ? 10000 : 0;
          const st = res.stats || {};
          let heuristic = Number(st.pleasure || 0) + Number(st.drama || 0) * 0.3;
          if (endingType === 'hidden') heuristic += Number(st.evidence || 0) * 100;
          else if (endingType === 'subversive') heuristic += Number(st.subversion || 0) * 100;
          else if (endingType === 'unfinished') heuristic += Number(st.anger || 0) * 5 - Number(st.evidence || 0) * 120;
          else heuristic -= Math.max(0, Number(st.evidence || 0) - 2) * 300 + Math.max(0, Number(st.subversion || 0) - 2) * 300 + Math.max(0, Number(st.anger || 0) - 80) * 10;
          return hit + heuristic;
        };

        let beam = [[]];
        for (let eIdx = 0; eIdx < eps.length; eIdx++) {
          const choices = eps[eIdx].choices || [];
          const nextBeam = [];
          beam.forEach((prefix) => {
            choices.forEach((ch, cIdx) => {
              const cand = prefix.concat([cIdx]);
              // 对前缀做轻量多样性评分，防止全选同一列导致阈值溢出
              let ev = 0, sv = 0, ang = 10, pl = 15, ex = 0;
              cand.forEach((ci, idx) => {
                const pick = eps[idx].choices[ci];
                const eff = (pick && pick.effects) || {};
                ev += Number(eff.evidence || 0);
                sv += Number(eff.subversion || 0);
                ang += Number(eff.anger || 0);
                pl += Number(eff.pleasure || 0);
                const lk = getChoiceEndingLink(pick, endings);
                if (lk.mode === 'explicit' && lk.ending && lk.ending.type === endingType) ex += 200;
              });
              let keyScore = ex + pl;
              if (endingType === 'hidden') keyScore += ev * 80;
              else if (endingType === 'subversive') keyScore += sv * 80;
              else if (endingType === 'unfinished') keyScore += ang * 3 - ev * 100;
              else keyScore -= (ev >= 3 ? 500 : 0) + (sv >= 3 ? 500 : 0) + (ang >= 85 ? 500 : 0) + Math.abs(ev - sv) * 10;
              nextBeam.push({ path: cand, keyScore });
            });
          });
          nextBeam.sort((a, b) => b.keyScore - a.keyScore);
          beam = nextBeam.slice(0, 12).map((x) => x.path);
        }

        let topScore = -1e9;
        beam.forEach((p) => {
          const sc = scoreCandidate(p);
          if (sc > topScore) { topScore = sc; bestPath = p; }
        });

        state.mmSimPath = bestPath || eps.map(() => 0);
        const simResult = evaluateMindMapSimPath(s, state.mmSimPath);
        if (simResult.matchedEndIdx >= 0) {
          state.mmSelectedNode = { type: 'ending', epIdx: 0, chIdx: 0, endIdx: simResult.matchedEndIdx };
        }
        this.syncMindMapCanvas();
        this.syncMindMapInspector();
      },

        const nextNum = (s.episodes || []).length + 1;
        s.episodes.push({

      setMindMapZoom(valOrDelta, isAbsolute = false) {
        const next = isAbsolute ? Number(valOrDelta) : (state.mmZoom + Number(valOrDelta));
        state.mmZoom = Math.min(1.35, Math.max(0.45, Number(next.toFixed(2))));
        const wrap = document.getElementById('mm-stage-wrap');
        const stage = document.getElementById('mm-stage');
        const label = document.getElementById('mm-zoom-label');
        if (wrap && state.editingScript) {
          const layout = computeMindMapLayout(state.editingScript);
          wrap.style.width = `${Math.ceil(layout.width * state.mmZoom)}px`;
          wrap.style.height = `${Math.ceil(layout.height * state.mmZoom)}px`;
        }
        if (stage) {
          stage.style.transform = `scale(${state.mmZoom})`;
        }
        if (label) label.textContent = `${Math.round(state.mmZoom * 100)}%`;
      },

      fitMindMapZoom() {
        const vp = document.getElementById('mm-viewport');
        if (!vp || !state.editingScript) return;
        const layout = computeMindMapLayout(state.editingScript);
        const wRatio = (vp.clientWidth - 44) / layout.width;
        const best = Math.max(0.62, Math.min(1.0, wRatio));
        this.setMindMapZoom(best, true);
      },

      syncFormToEditingScript() {
        const s = state.editingScript;
        if (!s) return;
        const titleEl = document.getElementById('edit-s-title');
        if (!titleEl) return;
        s.title = titleEl.value.trim();
        s.subtitle = (document.getElementById('edit-s-subtitle') ? document.getElementById('edit-s-subtitle').value : '').trim();
        s.tag = document.getElementById('edit-s-tag').value.trim();
        s.defaultProtagonist = document.getElementById('edit-s-actor').value.trim();
        const recEl = document.getElementById('edit-s-recommend');
        if (recEl) s.recommend = recEl.value === '1';
        s.coverImage = document.getElementById('edit-s-cover').value.trim() || '/static/art/covers/cover-dragon.jpg';
        s.coverTheme = document.getElementById('edit-s-theme').value.trim() || '#FFE600';
        s.synopsis = document.getElementById('edit-s-synopsis').value.trim();

        s.episodes.forEach((ep, eIdx) => {
          const tEl = document.getElementById(`edit-ep-title-${eIdx}`);
          const dEl = document.getElementById(`edit-ep-desc-${eIdx}`);
          const imgEl = document.getElementById(`edit-ep-image-${eIdx}`);
          if (tEl) ep.title = tEl.value;
          if (dEl) ep.sceneDesc = dEl.value;
          if (imgEl) ep.sceneImage = imgEl.value.trim();
          ep.choices.forEach((ch, cIdx) => {
            const ct = document.getElementById(`edit-ch-text-${eIdx}-${cIdx}`);
            const cf = document.getElementById(`edit-ch-fb-${eIdx}-${cIdx}`);
            const cb = document.getElementById(`edit-ch-bonus-${eIdx}-${cIdx}`);
            if (ct) ch.text = ct.value;
            if (cf) { ch.feedback = cf.value; ch.outcome = cf.value; }
            if (cb) ch.qualityBonus = Number(cb.value) || 15;
          });
        });
      },

          setTimeout(() => this.fitMindMapZoom(), 30);

      uploadCollectionImage(inputEl) {

        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const res = await fetch(`${API_BASE}/duanju/upload`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fileName: file.name, base64: ev.target.result })
            });
            const data = await res.json();
            if (data.code === 200 && data.url) {
              document.getElementById('edit-col-img').value = data.url;
              document.getElementById('edit-col-img-prev').src = data.url;
              notify('图鉴插画上传成功，保存后同步小程序');
            } else {
              notify(data.msg || '图片上传失败', 'error');
            }
          } catch (err) {
            notify('图片上传失败: ' + err.message, 'error');
          }
        };
        reader.readAsDataURL(file);

                <thead>
                  <tr>
                    <th style="width:70px;text-align:center;">图鉴插画</th>
                    <th>图鉴编码</th>
                    <th>所属剧本</th>
                    <th>结局类型</th>
                    <th>图鉴名称</th>
                    <th style="min-width:220px;">未解锁线索提示 (Hint)</th>
                    <th style="width:130px;text-align:center;">操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.collections.map((c) => {
                    const tInfo = typeLabelMap[c.endingType] || typeLabelMap.triumph;
                    return `
                    <tr>
                      <td style="text-align:center;">
                        <img src="${c.imageUrl || c.coverImage}" style="width:42px;height:56px;object-fit:cover;border-radius:4px;border:1px solid #cbd5e1;display:block;margin:0 auto;" onerror="this.onerror=null;this.src='${c.coverImage || '/static/art/covers/cover-dragon.jpg'}';" />
                      </td>
                      <td><code>${c.cardId}</code></td>
                      <td>${c.scriptTitle}</td>
                      <td><span class="el-tag ${tInfo.cls}">${tInfo.text}</span></td>
                      <td><strong>${c.title}</strong></td>
                      <td style="white-space:normal;min-width:220px;line-height:1.4;">${c.hint}</td>
                      <td style="text-align:center;white-space:nowrap;">
                        <button class="el-btn el-btn-primary" onclick="adminApp.openEditCollection('${c.cardId}', '${c.scriptId}')">编辑图鉴与图片</button>
                        <button class="el-btn el-btn-danger" onclick="adminApp.deleteCollection('${c.cardId}', '${c.scriptId}', '${c.title}')">删除</button>
                      </td>
                    </tr>
                  `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          ${state.editingCollection ? `
            <div class="drawer-mask" style="position:fixed;inset:0;background:rgba(15,23,42,0.55);z-index:2000;display:flex;justify-content:flex-end;" onclick="if(event.target===this)adminApp.closeCollectionDrawer()">
              <div class="drawer-box" style="width:520px;max-width:95vw;height:100vh;background:#fff;padding:20px 24px;overflow-y:auto;box-shadow:-6px 0 24px rgba(0,0,0,0.18);">
                <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;padding-bottom:12px;margin-bottom:14px;">
                  <h3 style="margin:0;">${state.editingCollection.isNew ? '新增剧本图鉴' : `编辑图鉴：${state.editingCollection.title}`}</h3>
                  <button class="el-btn el-btn-default" onclick="adminApp.closeCollectionDrawer()">关闭</button>
                </div>

                ${state.editingCollection.isNew ? `
                  <div style="margin-bottom:12px;">
                    <label style="display:block;font-weight:700;font-size:12px;margin-bottom:4px;">所属剧本</label>
                    <select id="edit-col-script" class="el-select" style="width:100%;">
                      ${state.collectionScripts.map((s) => `<option value="${s.scriptId}" ${state.editingCollection.scriptId === s.scriptId ? 'selected' : ''}>${s.title} (${s.scriptId})</option>`).join('')}
                    </select>
                  </div>
                  <div style="margin-bottom:12px;">
                    <label style="display:block;font-weight:700;font-size:12px;margin-bottom:4px;">图鉴编码 (可选，留空自动生成)</label>
                    <input id="edit-col-cardid" class="el-input" style="width:100%;" placeholder="例如：dragon.end5" value="${state.editingCollection.cardId || ''}" />
                  </div>
                ` : ''}

                <div style="margin-bottom:12px;">
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:4px;">图鉴名称</label>
                  <input id="edit-col-title" class="el-input" style="width:100%;" value="${state.editingCollection.title || ''}" placeholder="请输入结局图鉴标题" />
                </div>

                <div style="margin-bottom:12px;">
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:4px;">结局类型</label>
                  <select id="edit-col-type" class="el-select" style="width:100%;">
                    <option value="hidden" ${state.editingCollection.endingType === 'hidden' ? 'selected' : ''}>隐藏彩蛋 (hidden)</option>
                    <option value="subversive" ${state.editingCollection.endingType === 'subversive' ? 'selected' : ''}>反套路收官 (subversive)</option>
                    <option value="unfinished" ${state.editingCollection.endingType === 'unfinished' ? 'selected' : ''}>喜剧烂尾 (unfinished)</option>
                    <option value="triumph" ${state.editingCollection.endingType === 'triumph' ? 'selected' : ''}>爽剧完结 (triumph)</option>
                  </select>
                </div>

                <div style="margin-bottom:12px;">
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:4px;">图鉴插画图片 (URL 或本地上传)</label>
                  <div style="display:flex;gap:10px;align-items:center;">
                    <img id="edit-col-img-prev" src="${state.editingCollection.imageUrl || '/static/art/covers/cover-dragon.jpg'}" style="width:60px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;background:#fff;flex-shrink:0;" onerror="this.src='/static/art/covers/cover-dragon.jpg';" />
                    <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
                      <input id="edit-col-img" class="el-input" style="width:100%;font-size:12px;" value="${state.editingCollection.imageUrl || ''}" oninput="document.getElementById('edit-col-img-prev').src=this.value;" placeholder="/static/art/endings/ending-xxx.jpg" />
                      <label class="el-btn el-btn-default" style="display:inline-block;text-align:center;cursor:pointer;font-size:12px;">
                        本地上传图鉴图片
                        <input type="file" accept="image/*" style="display:none;" onchange="adminApp.uploadCollectionImage(this)" />
                      </label>
                    </div>
                  </div>
                </div>

                <div style="margin-bottom:12px;">
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:4px;">未解锁线索提示 (Hint)</label>
                  <input id="edit-col-hint" class="el-input" style="width:100%;" value="${state.editingCollection.hint || ''}" />
                </div>

                <div style="margin-bottom:16px;">
                  <label style="display:block;font-weight:700;font-size:12px;margin-bottom:4px;">结局正文剧情</label>
                  <textarea id="edit-col-text" class="el-textarea" rows="4" style="width:100%;">${state.editingCollection.text || ''}</textarea>
                </div>

                <div style="display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #e2e8f0;padding-top:12px;">
                  <button class="el-btn el-btn-default" onclick="adminApp.closeCollectionDrawer()">取消</button>
                  <button class="el-btn el-btn-primary" onclick="adminApp.saveCollectionForm()">保存并同步小程序</button>
                </div>
              </div>
            </div>
          ` : ''}
        `;
        return;
      }

      // =========================================================================
      // 七、 封神排行榜风控与防作弊管理
      // =========================================================================
      if (state.tab === 'leaderboard') {
        box.innerHTML = `
          <div class="el-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <div>
                <h3> 封神排行榜管理与防作弊风控</h3>
                <p style="font-size:12px;color:#909399;margin-top:4px;">支持对违规自定义主演名一键重置、违规记录下榜，以及测试服务端 choice_path 算分防作弊拦截。</p>
              </div>
              <div>
                <button class="el-btn el-btn-danger" onclick="adminApp.testAntiCheatAttack()"> 模拟抓包篡改 9999 分防作弊拦截测试</button>
              </div>
            </div>

            <div style="margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;">
              <button class="el-btn ${state.leaderboardScriptFilter === '' ? 'el-btn-primary' : 'el-btn-default'}" onclick="adminApp.filterLeaderboard('')">全部剧本榜单 (${state.scripts.length}部)</button>
              ${state.scripts.map((s) => `
                <button class="el-btn ${state.leaderboardScriptFilter === s.scriptId ? 'el-btn-primary' : 'el-btn-default'}" onclick="adminApp.filterLeaderboard('${s.scriptId}')">《${s.title}》</button>
              `).join('')}
            </div>

            <div class="table-responsive">
              <table class="el-table">
                <thead>
                  <tr>
                    <th>榜单ID</th>
                    <th>所属剧本</th>
                    <th>导演昵称 (微信)</th>
                    <th>定制主演名</th>
                    <th>达成结局</th>
                    <th>杀青质量分</th>
                    <th>首日票房</th>
                    <th>上榜状态</th>
                    <th>风控处置操作</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.leaderboards.map((r) => {
                    const matchedScript = state.scripts.find((s) => s.scriptId === r.scriptId);
                    const scriptDisplay = matchedScript ? `《${matchedScript.title}》` : r.scriptId;
                    return `
                    <tr>
                      <td><code>${r.rankId}</code></td>
                      <td>${scriptDisplay}</td>
                      <td>${r.nickname}</td>
                      <td>
                        <strong>${r.actorName}</strong>
                        <button class="el-btn el-btn-default" style="margin-left:6px;padding:1px 6px;font-size:11px;" onclick="adminApp.resetActorName(${r.rankId})">重置违规名</button>
                      </td>
                      <td>${r.endingTitle}</td>
                      <td><strong>${r.qualityScore} 分</strong></td>
                      <td>${(r.boxOffice / 100000000).toFixed(2)} 亿</td>
                      <td>
                        <span class="el-tag ${r.status === '0' ? 'tag-green' : 'tag-red'}">
                          ${r.status === '0' ? '正常上榜' : '违规已下榜'}
                        </span>
                      </td>
                      <td>
                        <button class="el-btn ${r.status === '0' ? 'el-btn-warning' : 'el-btn-success'}"
                          onclick="adminApp.toggleRankRecordStatus(${r.rankId}, '${r.status}')">
                          ${r.status === '0' ? '下榜隐藏' : '恢复上榜'}
                        </button>
                      </td>
                    </tr>
                  `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        return;
      }

      // =========================================================================
      // 八、 拍摄杀青流水监控
      // =========================================================================
      if (state.tab === 'record') {
        box.innerHTML = `
          <div class="el-card">
            <h3 style="margin-bottom:14px;"> 玩家开拍与杀青流水监控 (全服玩家操作实时日志)</h3>
            <div class="table-responsive">
              <table class="el-table">
                <thead>
                  <tr>
                    <th>流水号</th>
                    <th>玩家 OpenID</th>
                    <th>拍摄剧本</th>
                    <th>领衔主演</th>
                    <th>最终达成结局</th>
                    <th>杀青分</th>
                    <th>首日票房</th>
                    <th>完播耗时</th>
                    <th>杀青提交时间</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.records.map((rec) => `
                    <tr>
                      <td><code>${rec.recordId}</code></td>
                      <td>${rec.openid}</td>
                      <td>《${rec.scriptTitle}》</td>
                      <td><strong>${rec.actorName}</strong></td>
                      <td>${rec.endingTitle}</td>
                      <td><span style="color:#409EFF;font-weight:700;">${rec.qualityScore} 分</span></td>
                      <td>${(rec.boxOffice / 100000000).toFixed(2)} 亿</td>
                      <td>${rec.durationSeconds} 秒</td>
                      <td>${rec.createTime}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        return;
      }

      // =========================================================================
      // 九、 导演档期与拍摄进度
      // =========================================================================
      if (state.tab === 'progress') {
        box.innerHTML = `
          <div class="el-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
              <div>
                <h3 style="font-size:16px;">全服导演各剧本拍摄档期与进度监控</h3>
                <p style="font-size:12px;color:#909399;margin-top:4px;">实时查看每位导演各剧本的断点拍摄进度、当前集数、局内5维属性与杀青状态，支持断点重拍与跨剧本追踪。</p>
              </div>
              <div>
                <button class="el-btn el-btn-primary" onclick="adminApp.loadTabData()"> 刷新进度数据</button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="el-table">
                <thead>
                  <tr>
                    <th>进度ID</th>
                    <th>导演ID</th>
                    <th>微信OpenID</th>
                    <th>剧本编码</th>
                    <th>剧本名称</th>
                    <th>当前拍摄集数</th>
                    <th>拍摄状态</th>
                    <th>局内爽点值</th>
                    <th>戏剧浓度</th>
                    <th>反派怒气</th>
                    <th>已备材料</th>
                    <th>拆套路</th>
                    <th>杀青评分</th>
                    <th>更新时间</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.progressList.length === 0 ? `
                    <tr><td colspan="14" style="text-align:center;padding:20px;color:#909399;">暂无拍摄进度记录</td></tr>
                  ` : state.progressList.map(p => `
                    <tr>
                      <td><code>${p.id}</code></td>
                      <td>${p.userId}</td>
                      <td><span style="font-family:monospace;font-size:11px;">${p.openid}</span></td>
                      <td><code>${p.scriptId}</code></td>
                      <td><strong>《${p.scriptTitle || p.scriptId}》</strong></td>
                      <td>
                        <span class="el-tag ${p.isFinished === '1' ? 'tag-green' : 'tag-gold'}">
                          ${p.isFinished === '1' ? '全 6 集已杀青' : `第 ${p.currentEpisode} / 6 集`}
                        </span>
                      </td>
                      <td>
                        <span class="el-tag ${p.isFinished === '1' ? 'tag-green' : 'tag-blue'}">
                          ${p.isFinished === '1' ? '已杀青' : '拍摄中'}
                        </span>
                      </td>
                      <td>${p.currentStats ? (p.currentStats.pleasure || 0) : 0}</td>
                      <td>${p.currentStats ? (p.currentStats.drama || 0) : 0}</td>
                      <td>${p.currentStats ? (p.currentStats.anger || 0) : 0}</td>
                      <td>${p.currentStats ? (p.currentStats.evidence || 0) : 0}</td>
                      <td>${p.currentStats ? (p.currentStats.subversion || 0) : 0}</td>
                      <td><strong>${p.finishScore ? p.finishScore + ' 分' : '-'}</strong></td>
                      <td style="font-size:12px;color:#909399;">${p.updateTime || '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
        return;
      }

      // =========================================================================
      // 十、 风控与提审配置
      // =========================================================================
      if (state.tab === 'config') {
        const c = state.config;
        box.innerHTML = `
          <div class="el-card">
            <h3 style="margin-bottom:16px;">微信提审纯净模式与风控总控</h3>

            <div style="margin-bottom:20px;padding:16px;background:#fdf6ec;border:1px solid #faecd8;border-radius:6px;">
              <h4 style="color:#e6a23c;margin-bottom:8px;"> 微信提审纯净模式 (一键热更，秒级生效无需重新打包)</h4>
              <p style="font-size:13px;color:#606266;margin-bottom:12px;">开启后小程序自动隐藏封神榜、跑马灯喜报、插屏激励广告与好友PK，文案切换为绿色合规版本，过审后再一键关闭恢复全量玩法。</p>
              <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;">
                <input type="checkbox" id="cfg-audit" ${c.auditMode ? 'checked' : ''} style="width:18px;height:18px;" />
                <span>开启「微信提审纯净模式」</span>
              </label>
            </div>

            <div style="margin-bottom:20px;padding:16px;border:1px solid #ebeef5;border-radius:6px;">
              <h4 style="margin-bottom:8px;"> 激励视频广告与分享裂变开关</h4>
              <p style="font-size:13px;color:#909399;margin-bottom:12px;">控制小程序内「解锁特殊卡牌」或「双倍票房」是否展示微信广告组件。</p>
              <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;">
                <input type="checkbox" id="cfg-ad" ${c.adEnabled ? 'checked' : ''} style="width:18px;height:18px;" />
                <span>全局启用激励视频广告</span>
              </label>
            </div>

            <div style="margin-bottom:20px;padding:16px;background:#fef0f0;border:1px solid #fde2e2;border-radius:6px;">
              <h4 style="color:#f56c6c;margin-bottom:8px;">敏感词紧急熔断与兜底替换</h4>
              <p style="font-size:13px;color:#606266;margin-bottom:12px;">若全服榜单出现突发敏感词，开启此项全服战报将强制以「默认主角」脱敏展示。</p>
              <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;cursor:pointer;">
                <input type="checkbox" id="cfg-clean" ${c.emergencyCleanName ? 'checked' : ''} style="width:18px;height:18px;" />
                <span>开启全服主演名紧急脱敏熔断</span>
              </label>
            </div>

            <div style="margin-bottom:20px;">
              <h4 style="margin-bottom:8px;"> 自定义主演名本地风控敏感词黑名单字典（一行一个）</h4>
              <textarea id="cfg-words" class="el-textarea" rows="6">${(c.sensitiveWords || []).join('\n')}</textarea>
            </div>

            <button class="el-btn el-btn-primary" style="padding:10px 24px;font-size:14px;" onclick="adminApp.saveConfig()"> 保存风控与提审配置并实时热更</button>
          </div>
        `;
        return;
      }
    }

    // 初始化入口：自动判断登录状态
    window.addEventListener('DOMContentLoaded', () => {
      if (state.token) {
        adminApp.enterWorkbench();
      } else {
        adminApp.showLogin();
      }
    });
  </script>
</body>
</html>
