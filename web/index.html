  <script>
    const API_ORIGIN = window.location.port === '8081'
      ? `${window.location.protocol}//${window.location.hostname || 'localhost'}:8080`
      : window.location.origin;
    const API_BASE = `${API_ORIGIN}/dev-api`;

    // 全局鉴权 Header 注入 + 异步写操作按钮自动 Loading 与防重拦截器
    (function setupAutoBtnLoading() {
      const rawFetch = window.fetch.bind(window);
      window.fetch = async function(input, init) {
        const urlStr = typeof input === 'string' ? input : (input && input.url) || '';
        const nextInit = { ...(init || {}) };
        if (urlStr.startsWith(API_BASE) && !urlStr.endsWith('/login')) {
          const token = localStorage.getItem('Admin-Token') || (typeof state !== 'undefined' && state.token) || '';
          nextInit.headers = {
            ...(nextInit.headers || {}),
            ...(token ? { Authorization: `Bearer ${token}` } : {})
          };
        }
        const method = (nextInit.method || 'GET').toUpperCase();
        const activeBtn = (method === 'POST' || method === 'PUT' || method === 'DELETE') &&
          document.activeElement && document.activeElement.tagName === 'BUTTON'
          ? document.activeElement
          : null;
        let prevHtml = '';
        if (activeBtn && !activeBtn.classList.contains('is-loading')) {
          prevHtml = activeBtn.innerHTML;
          activeBtn.classList.add('is-loading');
          activeBtn.disabled = true;
          activeBtn.innerHTML = `<span class="ry-spinner"></span>处理中...`;
        }
        try {
          const resp = await rawFetch(input, nextInit);
          if (resp.status === 401 && urlStr.startsWith(API_BASE) && !urlStr.endsWith('/login')) {
            localStorage.removeItem('Admin-Token');
            if (typeof state !== 'undefined') state.token = '';
            if (window.adminApp && typeof window.adminApp.showLogin === 'function') window.adminApp.showLogin();
          }
          return resp;
        } finally {
          if (activeBtn && activeBtn.isConnected) {
            activeBtn.classList.remove('is-loading');
            activeBtn.disabled = false;
            if (prevHtml) activeBtn.innerHTML = prevHtml;
          }
        }
      };
    })();

    const state = {
      token: localStorage.getItem('Admin-Token') || '',
      currentUser: { userName: '', nickName: '超级管理员' },
      captchaAnswer: null,
      tab: 'dashboard',
      dashboardScriptId: 'script_01_zhuixu',
      dashboardData: null,
      scripts: [],
      editingScript: null,
      scriptEditorMode: 'mindmap',
      mmSelectedNode: { type: 'root' },
      mmHoverNode: null,
      mmZoom: 0.85,
      mmSimPath: [],
      mmEndingViewMode: 'all',
      collections: [],
      collectionScripts: [],
      collectionScriptFilter: '',
      editingCollection: null,
      leaderboards: [],
      leaderboardScriptFilter: '',
      records: [],
      progressList: [],
      sysUsers: [],
      sysRoles: [
        { roleId: 1, roleName: '超级管理员', roleKey: 'admin', roleSort: 1, status: '0', createTime: '2026-01-01 12:00:00' },
        { roleId: 2, roleName: '短剧运营专员', roleKey: 'duanju_ops', roleSort: 2, status: '0', createTime: '2026-03-15 10:20:00' },
        { roleId: 3, roleName: '风控安全员', roleKey: 'auditor', roleSort: 3, status: '0', createTime: '2026-05-20 14:30:00' }
      ],
      playerUsers: [],
      playerFilterNickname: '',
      playerFilterStatus: '',
      config: { auditMode: false, adEnabled: true, emergencyCleanName: false, sensitiveWords: [] }
    };

    function notify(msg, isError = false) {
      const el = document.getElementById('ry-toast');
      el.textContent = msg;
      el.style.background = isError ? '#F56C6C' : '#67C23A';
      el.style.display = 'block';
      clearTimeout(window.__ryTimer);
      window.__ryTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    function escapeHtml(val) {
      return String(val === undefined || val === null ? '' : val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const ENDING_TYPE_META = {
      hidden: { label: '隐藏彩蛋', color: '#EF4444', softBg: '#FEF2F2', border: '#FCA5A5', badgeText: '#B91C1C' },
      subversive: { label: '反套路收官', color: '#10B981', softBg: '#ECFDF5', border: '#6EE7B7', badgeText: '#047857' },
      unfinished: { label: '喜剧烂尾', color: '#F59E0B', softBg: '#FFFBEB', border: '#FCD34D', badgeText: '#B45309' },
      triumph: { label: '爽剧完结', color: '#3B82F6', softBg: '#EFF6FF', border: '#93C5FD', badgeText: '#1D4ED8' }
    };

    function getEndingTypeMeta(typeKey) {
      return ENDING_TYPE_META[typeKey] || ENDING_TYPE_META.triumph;
    }

    function buildDefaultEndings(scriptId, coverImage) {
      const sid = scriptId || 'new_script';
      const cov = coverImage || '/static/art/covers/cover-dragon.jpg';
      return [
        {
          id: `${sid}.end1`,
          type: 'hidden',
          priority: 100,
          title: '隐藏彩蛋结局',
          posterTag: '隐藏彩蛋',
          imageUrl: cov,
          hint: '累计搜证材料 >= 4 且反派怒气 <= 42 即可解锁',
          text: '关键证据逐一拼合，尘封真相彻底揭晓，迎来意外反转。',
          condition: { minStats: { evidence: 4 }, maxStats: { anger: 42 } }
        },
        {
          id: `${sid}.end2`,
          type: 'subversive',
          priority: 90,
          title: '反套路收官结局',
          posterTag: '反套路收官',
          imageUrl: cov,
          hint: '累计拆套路达到3次以上即可触发',
          text: '你屡次打破陈旧套路，带着全场一起掀翻原有剧本规则。',
          condition: { minStats: { subversion: 3 } }
        },
        {
          id: `${sid}.end3`,
          type: 'unfinished',
          priority: 80,
          title: '喜剧烂尾结局',
          posterTag: '喜剧烂尾',
          imageUrl: cov,
          hint: '反派怒气拉满且关键材料不足时触发',
          text: '全员情绪上头却手续未齐，大幕在戏剧性反转中仓促落下。',
          condition: { minStats: { anger: 85 }, maxStats: { evidence: 1 } }
        },
        {
          id: `${sid}.end4`,
          type: 'triumph',
          priority: 70,
          title: '爽剧完结结局',
          posterTag: '爽剧完结',
          imageUrl: cov,
          hint: '按常规节奏拍满6集即可达成',
          text: '主线矛盾顺利收束，主角堂堂正正夺回属于自己的一切。',
          condition: { always: true }
        }
      ];
    }

    function normalizeEditingScript(raw) {
      const item = JSON.parse(JSON.stringify(raw || {}));
      if (!item.coverImage) item.coverImage = '/static/art/covers/cover-dragon.jpg';
      if (!item.coverTheme) item.coverTheme = '#FFE600';
      if (!item.initialStats || typeof item.initialStats !== 'object') {
        item.initialStats = { pleasure: 15, drama: 25, anger: 10, evidence: 0, subversion: 0 };
      }
      if (!Array.isArray(item.episodes) || item.episodes.length === 0) {
        item.episodes = Array.from({ length: 6 }, (_, idx) => ({
          ep: idx + 1,
          title: `第 ${idx + 1} 集：高能反转`,
          sceneDesc: `第 ${idx + 1} 集独白：在这里配置本集的场景独白与剧情冲突...`,
          sceneImage: item.coverImage,
          choices: [
            { choiceId: `c_${idx + 1}_1`, id: 'A', label: 'A', text: '按套路出牌，正面对决', styleTag: '经典套路', feedback: '剧情平稳推进，收集到关键证据。', outcome: '剧情平稳推进，收集到关键证据。', qualityBonus: 12, targetEndingId: '', effects: { pleasure: 12, drama: 10, anger: 7, evidence: 1, subversion: 0 } },
            { choiceId: `c_${idx + 1}_2`, id: 'B', label: 'B', text: '极度离谱反套路，当场整活', styleTag: '离谱反套路', feedback: '意料之外的戏剧性大反转，反派怒气飙升！', outcome: '意料之外的戏剧性大反转，反派怒气飙升！', qualityBonus: 18, targetEndingId: '', effects: { pleasure: 6, drama: 16, anger: 16, evidence: 0, subversion: 0 } },
            { choiceId: `c_${idx + 1}_3`, id: 'C', label: 'C', text: '打工人硬核觉醒，依法掀桌', styleTag: '打工人觉醒', feedback: '全场震惊，成功拆解既有套路！', outcome: '全场震惊，成功拆解既有套路！', qualityBonus: 15, targetEndingId: '', effects: { pleasure: 7, drama: 7, anger: -5, evidence: 0, subversion: 1 } }
          ]
        }));
      } else {
        item.episodes = item.episodes.map((ep, eIdx) => {
          const defaultLabels = ['A', 'B', 'C'];
          const choices = Array.isArray(ep.choices) && ep.choices.length ? ep.choices : [];
          while (choices.length < 3) {
            const cIdx = choices.length;
            choices.push({
              choiceId: `c_${eIdx + 1}_${cIdx + 1}`,
              id: defaultLabels[cIdx] || String(cIdx + 1),
              label: defaultLabels[cIdx] || String(cIdx + 1),
              text: '新增分镜选项',
              styleTag: '经典套路',
              feedback: '推动剧情继续发展。',
              outcome: '推动剧情继续发展。',
              qualityBonus: 15,
              targetEndingId: '',
              effects: { pleasure: 10, drama: 10, anger: 5, evidence: 0, subversion: 0 }
            });
          }
          return {
            ...ep,
            ep: ep.ep || (eIdx + 1),
            sceneImage: ep.sceneImage || item.coverImage,
            choices: choices.map((ch, cIdx) => {
              const eff = ch.effects || {};
              const fb = ch.feedback || ch.outcome || '';
              return {
                ...ch,
                choiceId: ch.choiceId || `c_${eIdx + 1}_${cIdx + 1}`,
                id: ch.id || defaultLabels[cIdx] || String(cIdx + 1),
                label: ch.label || defaultLabels[cIdx] || String(cIdx + 1),
                styleTag: ch.styleTag || '经典套路',
                qualityBonus: Number(ch.qualityBonus) || 15,
                feedback: fb,
                outcome: ch.outcome || fb,
                targetEndingId: ch.targetEndingId || '',
                effects: {
                  pleasure: Number(eff.pleasure || 0),
                  drama: Number(eff.drama || 0),
                  anger: Number(eff.anger || 0),
                  evidence: Number(eff.evidence || 0),
                  subversion: Number(eff.subversion || 0)
                }
              };
            })
          };
        });
      }
      if (!Array.isArray(item.endings) || item.endings.length === 0) {
        item.endings = buildDefaultEndings(item.scriptId, item.coverImage);
      } else {
        item.endings = item.endings.map((end, idx) => ({
          id: end.id || end.endingId || `${item.scriptId || 'script'}.end${idx + 1}`,
          type: end.type || 'triumph',
          priority: Number(end.priority) || (100 - idx * 10),
          title: end.title || `结局 ${idx + 1}`,
          posterTag: end.posterTag || getEndingTypeMeta(end.type || 'triumph').label,
          imageUrl: end.imageUrl || item.coverImage,
          hint: end.hint || '',
          text: end.text || end.summary || '',
          condition: (end.condition && typeof end.condition === 'object') ? end.condition : (idx === item.endings.length - 1 ? { always: true } : {})
        }));
      }
      item.totalEpisodes = item.episodes.length;
      item.endingCount = item.endings.length;
      return item;
    }

    function getChoiceEndingLink(choice, endings) {
      const list = Array.isArray(endings) ? endings : [];
      if (!list.length) return { ending: null, endIdx: -1, mode: 'auto', reason: '未配置结局' };
      if (choice && choice.targetEndingId) {
        const directIdx = list.findIndex((e) => (e.id || e.endingId) === choice.targetEndingId);
        if (directIdx >= 0) {
          return { ending: list[directIdx], endIdx: directIdx, mode: 'explicit', reason: '指定直达结局' };
        }
      }
      const eff = (choice && choice.effects) || {};
      let targetType = 'triumph';
      let reason = '常规推进 -> 爽剧完结';
      if (Number(eff.evidence || 0) > 0) {
        targetType = 'hidden';
        reason = '搜证线索 -> 隐藏彩蛋';
      } else if (Number(eff.subversion || 0) > 0) {
        targetType = 'subversive';
        reason = '拆解套路 -> 反套路收官';
      } else if (Number(eff.anger || 0) >= 12 && Number(eff.evidence || 0) <= 0) {
        targetType = 'unfinished';
        reason = '激怒反派 -> 喜剧烂尾';
      }
      let endIdx = list.findIndex((e) => e.type === targetType);
      if (endIdx < 0) endIdx = list.findIndex((e) => e.type === 'triumph');
      if (endIdx < 0) endIdx = 0;
      return { ending: list[endIdx], endIdx, mode: 'auto', reason };
    }

    function resolveEndingByV2Rules(script, chosenChoices, choiceIds, stats) {
      const endings = (script && script.endings) || [];
      if (!endings.length) return { matchedEnding: null, matchedEndIdx: -1, routeReason: '暂无结局节点' };

      // 1. 优先匹配最终选择链中显式指定的 targetEndingId（从后往前以最后一次分支定调为准）
      for (let i = chosenChoices.length - 1; i >= 0; i--) {
        const ch = chosenChoices[i];
        if (ch && ch.targetEndingId) {
          const dIdx = endings.findIndex((e) => (e.id || e.endingId) === ch.targetEndingId);
          if (dIdx >= 0) {
            return { matchedEnding: endings[dIdx], matchedEndIdx: dIdx, routeReason: `第 ${i + 1} 集选项指定直达` };
          }
        }
      }

      // 2. 按 priority 降序评估条件结局（与服务端 resolveScriptEnding V2 逻辑完全一致）
      const indexed = endings.map((end, idx) => ({ end, idx }))
        .sort((a, b) => (Number(b.end.priority) || 0) - (Number(a.end.priority) || 0));

      for (const item of indexed) {
        const cond = item.end.condition || {};
        if (cond.always || cond.default) continue;
        const hasStatRule = Boolean((cond.minStats && Object.keys(cond.minStats).length) || (cond.maxStats && Object.keys(cond.maxStats).length) || cond.minAbsurd || cond.minThrill || cond.specialChoice);
        const passSpecial = !cond.specialChoice || choiceIds.includes(cond.specialChoice);
        const passFlags = (!Array.isArray(cond.allFlags) || cond.allFlags.length === 0 || hasStatRule) ? true : ((stats.evidence || 0) >= 3);
        const passAbsurd = !cond.minAbsurd || (stats.drama || 0) >= Number(cond.minAbsurd);
        const passThrill = !cond.minThrill || (stats.pleasure || 0) >= Number(cond.minThrill);
        const passMinStats = !cond.minStats || Object.entries(cond.minStats).every(([k, v]) => (stats[k] || 0) >= Number(v || 0));
        const passMaxStats = !cond.maxStats || Object.entries(cond.maxStats).every(([k, v]) => (stats[k] || 0) <= Number(v || 0));
        if (passSpecial && passFlags && passAbsurd && passThrill && passMinStats && passMaxStats) {
          return { matchedEnding: item.end, matchedEndIdx: item.idx, routeReason: `优先级 P${item.end.priority || 0} 条件命中` };
        }
      }

      const fallback = indexed.find((item) => item.end.condition && (item.end.condition.always || item.end.condition.default))
        || indexed.find((item) => item.end.type === 'triumph')
        || indexed[indexed.length - 1];
      return { matchedEnding: fallback.end, matchedEndIdx: fallback.idx, routeReason: '满足保底完结路线' };
    }

    function evaluateMindMapSimPath(script, simPath) {
      const episodes = (script && script.episodes) || [];
      const init = (script && script.initialStats) || {};
      const stats = {
        pleasure: Number(init.pleasure || 15),
        drama: Number(init.drama || 25),
        anger: Number(init.anger || 10),
        evidence: Number(init.evidence || 0),
        subversion: Number(init.subversion || 0)
      };
      const simChoices = [];
      const chosenChoices = [];
      const choiceIds = [];
      episodes.forEach((ep, epIdx) => {
        const cIdx = Number(simPath && simPath[epIdx]);
        const ch = (ep.choices || [])[cIdx];
        if (ch) {
          simChoices.push({ epIdx, chIdx: cIdx, choice: ch });
          chosenChoices.push(ch);
          choiceIds.push(ch.choiceId || ch.id || ch.label);
          const eff = ch.effects || {};
          stats.pleasure += Number(eff.pleasure || 0);
          stats.drama += Number(eff.drama || 0);
          stats.anger += Number(eff.anger || 0);
          stats.evidence += Number(eff.evidence || 0);
          stats.subversion += Number(eff.subversion || 0);
        }
      });

      const resolved = resolveEndingByV2Rules(script, chosenChoices, choiceIds, stats);
      return { stats, simChoices, ...resolved };
    }

    function analyzeAllScriptChains(script) {
      const episodes = (script && script.episodes) || [];
      const endings = (script && script.endings) || [];
      const init = (script && script.initialStats) || {};
      const endingStats = endings.map(() => ({ count: 0, percent: 0, samples: [] }));
      const choiceEndingCounts = episodes.map((ep) => (ep.choices || []).map(() => endings.map(() => 0)));
      const choiceEndingSample = episodes.map((ep) => (ep.choices || []).map(() => endings.map(() => null)));
      const choiceTotalCounts = episodes.map((ep) => (ep.choices || []).map(() => 0));

      if (!episodes.length || !endings.length) {
        return { totalChains: 0, isExact: true, endingStats, choiceEndingCounts, choiceEndingSample, choiceTotalCounts };
      }

      let estTotal = 1;
      episodes.forEach((ep) => { estTotal *= Math.max(1, (ep.choices || []).length); });
      const isExact = estTotal <= 12000;
      let totalChains = 0;

      const recordCompletePath = (path, chosen, ids, st) => {
        const res = resolveEndingByV2Rules(script, chosen, ids, st);
        const endIdx = res.matchedEndIdx;
        totalChains++;
        if (endIdx >= 0 && endingStats[endIdx]) {
          const es = endingStats[endIdx];
          es.count++;
          // 为每个结局收集最多 12 条具有不同起手/中段走向的完整示例链路
          const prefixTag = `${path[0]}_${path[Math.floor(path.length / 2)] || 0}`;
          const hasTag = es.samples.some((sp) => sp.prefixTag === prefixTag);
          if (es.samples.length < 12 && (!hasTag || es.samples.length < 4)) {
            const codeStr = path.map((ci, eIdx) => {
              const lbl = (episodes[eIdx].choices[ci] && episodes[eIdx].choices[ci].label) || (ci === 0 ? 'A' : (ci === 1 ? 'B' : 'C'));
              return `${eIdx + 1}${lbl}`;
            }).join(' -> ');
            es.samples.push({ path: [...path], codeStr, stats: { ...st }, prefixTag });
          }
          path.forEach((ci, eIdx) => {
            choiceTotalCounts[eIdx][ci]++;
            choiceEndingCounts[eIdx][ci][endIdx]++;
            if (!choiceEndingSample[eIdx][ci][endIdx]) {
              choiceEndingSample[eIdx][ci][endIdx] = [...path];
            }
          });
        }
      };

      const baseStats = {
        pleasure: Number(init.pleasure || 15),
        drama: Number(init.drama || 25),
        anger: Number(init.anger || 10),
        evidence: Number(init.evidence || 0),
        subversion: Number(init.subversion || 0)
      };

      if (isExact) {
        const walk = (epIdx, path, chosen, ids, st) => {
          if (epIdx === episodes.length) {
            recordCompletePath(path, chosen, ids, st);
            return;
          }
          const choices = episodes[epIdx].choices || [];
          for (let ci = 0; ci < choices.length; ci++) {
            const c = choices[ci];
            const eff = c.effects || {};
            path.push(ci);
            chosen.push(c);
            ids.push(c.choiceId || c.id || c.label);
            walk(epIdx + 1, path, chosen, ids, {
              pleasure: st.pleasure + Number(eff.pleasure || 0),
              drama: st.drama + Number(eff.drama || 0),
              anger: st.anger + Number(eff.anger || 0),
              evidence: st.evidence + Number(eff.evidence || 0),
              subversion: st.subversion + Number(eff.subversion || 0)
            });
            path.pop();
            chosen.pop();
            ids.pop();
          }
        };
        walk(0, [], [], [], baseStats);
      } else {
        // 超过 8 集时采用确定性伪随机分层抽样 6000 条完整链路
        let seed = 20261126;
        const nextRand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
        for (let k = 0; k < 6000; k++) {
          const path = [];
          const chosen = [];
          const ids = [];
          const st = { ...baseStats };
          for (let eIdx = 0; eIdx < episodes.length; eIdx++) {
            const choices = episodes[eIdx].choices || [];
            const ci = k < choices.length ? k % choices.length : Math.floor(nextRand() * choices.length);
            const c = choices[ci];
            const eff = (c && c.effects) || {};
            path.push(ci);
            chosen.push(c);
            ids.push(c.choiceId || c.id || c.label);
            st.pleasure += Number(eff.pleasure || 0);
            st.drama += Number(eff.drama || 0);
            st.anger += Number(eff.anger || 0);
            st.evidence += Number(eff.evidence || 0);
            st.subversion += Number(eff.subversion || 0);
          }
          recordCompletePath(path, chosen, ids, st);
        }
      }

      endingStats.forEach((es) => {
        es.percent = totalChains > 0 ? Number(((es.count / totalChains) * 100).toFixed(1)) : 0;
      });
      return { totalChains, isExact, endingStats, choiceEndingCounts, choiceEndingSample, choiceTotalCounts };
    }

    function describeEndingCondition(end) {
      const cond = (end && end.condition) || {};
      if (cond.always || cond.default) return '默认保底路线（无前置门槛）';
      const parts = [];
      if (cond.minStats) {
        const nameMap = { pleasure: '爽点', drama: '戏剧', anger: '怒气', evidence: '材料', subversion: '拆套路' };
        Object.entries(cond.minStats).forEach(([k, v]) => parts.push(`${nameMap[k] || k} >= ${v}`));
      }
      if (cond.maxStats) {
        const nameMap = { pleasure: '爽点', drama: '戏剧', anger: '怒气', evidence: '材料', subversion: '拆套路' };
        Object.entries(cond.maxStats).forEach(([k, v]) => parts.push(`${nameMap[k] || k} <= ${v}`));
      }
      if (Array.isArray(cond.allFlags) && cond.allFlags.length && !parts.length) parts.push('搜证材料 >= 3');
      if (cond.specialChoice) parts.push(`特定选项: ${cond.specialChoice}`);
      return parts.length ? parts.join(' 且 ') : '通过选项指定直达或权重触发';
    }

    function formatChoiceEffectBadges(choice) {
      const eff = (choice && choice.effects) || {};
      const badges = [];
      if (Number(eff.evidence || 0) > 0) badges.push({ text: `搜证+${eff.evidence}`, bg: '#FEF3C7', color: '#B45309' });
      if (Number(eff.subversion || 0) > 0) badges.push({ text: `拆套路+${eff.subversion}`, bg: '#DCFCE7', color: '#15803D' });
      if (Number(eff.pleasure || 0) > 0) badges.push({ text: `爽点+${eff.pleasure}`, bg: '#DBEAFE', color: '#1D4ED8' });
      if (Number(eff.drama || 0) > 0) badges.push({ text: `戏剧+${eff.drama}`, bg: '#EDE9FE', color: '#6D28D9' });
      if (Number(eff.anger || 0) >= 10) badges.push({ text: `怒气+${eff.anger}`, bg: '#FEE2E2', color: '#B91C1C' });
      else if (Number(eff.anger || 0) < 0) badges.push({ text: `降怒${eff.anger}`, bg: '#E0F2FE', color: '#0369A1' });
      return badges.slice(0, 4);
    }

    function computeMindMapLayout(script) {
      const episodes = (script && script.episodes) || [];
      const endings = (script && script.endings) || [];
      const padX = 44;
      const padTop = 30;
      const rootW = 540;
      const rootH = 112;
      const epW = 540;
      const epH = 78;
      const choiceW = 310;
      const choiceH = 134;
      const choiceGap = 22;
      const choicesRowW = 3 * choiceW + 2 * choiceGap; // 974

      const endW = 240;
      const endH = 196;
      const endGap = 18;
      const endPerRow = Math.min(4, Math.max(1, endings.length));
      const endRowW = endPerRow * endW + (endPerRow - 1) * endGap;
      const canvasW = Math.max(choicesRowW, endRowW, rootW) + padX * 2;

      const rootPos = {
        x: (canvasW - rootW) / 2,
        y: padTop,
        w: rootW,
        h: rootH
      };

      let curY = rootPos.y + rootPos.h + 48;
      const epNodes = [];
      const choiceNodes = [];
      const choicesStartX = (canvasW - choicesRowW) / 2;

      episodes.forEach((ep, epIdx) => {
        const epPos = {
          epIdx,
          ep,
          x: (canvasW - epW) / 2,
          y: curY,
          w: epW,
          h: epH
        };
        epNodes.push(epPos);

        const chRowY = curY + epH + 38;
        (ep.choices || []).forEach((ch, chIdx) => {
          choiceNodes.push({
            epIdx,
            chIdx,
            choice: ch,
            link: getChoiceEndingLink(ch, endings),
            x: choicesStartX + chIdx * (choiceW + choiceGap),
            y: chRowY,
            w: choiceW,
            h: choiceH
          });
        });

        curY = chRowY + choiceH + (epIdx < episodes.length - 1 ? 62 : 96);
      });

      const endingNodes = endings.map((end, idx) => {
        const row = Math.floor(idx / 4);
        const col = idx % 4;
        const itemsInRow = Math.min(4, endings.length - row * 4);
        const thisRowW = itemsInRow * endW + (itemsInRow - 1) * endGap;
        const rowStartX = (canvasW - thisRowW) / 2;
        return {
          endIdx: idx,
          ending: end,
          x: rowStartX + col * (endW + endGap),
          y: curY + row * (endH + 24),
          w: endW,
          h: endH
        };
      });

      const totalEndRows = Math.max(1, Math.ceil(endings.length / 4));
      const canvasH = curY + totalEndRows * endH + (totalEndRows - 1) * 24 + 40;

      return {
        width: canvasW,
        height: canvasH,
        rootPos,
        epNodes,
        choiceNodes,
        endingNodes
      };
    }

    function computeMindMapFocusSet(script, simResult, analysis) {
      const sel = state.mmHoverNode || state.mmSelectedNode || { type: 'root' };
      const simMap = {};
      (simResult && simResult.simChoices ? simResult.simChoices : []).forEach((sc) => { simMap[sc.epIdx] = sc.chIdx; });

      const activeEndIdx = sel.type === 'ending' ? sel.endIdx : -1;
      const activeChoice = sel.type === 'choice' ? { epIdx: sel.epIdx, chIdx: sel.chIdx } : null;
      const activeEpIdx = sel.type === 'ep' ? sel.epIdx : -1;
      const isHoveringEnding = Boolean(state.mmHoverNode && state.mmHoverNode.type === 'ending');
      const isAllEndingMode = activeEndIdx >= 0 && (isHoveringEnding || (state.mmSelectedNode && state.mmSelectedNode.type === 'ending' && state.mmEndingViewMode !== 'single'));

      const isChoiceReachesActiveEnd = (epIdx, chIdx) => {
        if (activeEndIdx < 0 || !analysis || !analysis.choiceEndingCounts[epIdx]) return false;
        return (analysis.choiceEndingCounts[epIdx][chIdx][activeEndIdx] || 0) > 0;
      };

      const getChoiceActiveEndCount = (epIdx, chIdx) => {
        if (activeEndIdx < 0 || !analysis || !analysis.choiceEndingCounts[epIdx]) return 0;
        return analysis.choiceEndingCounts[epIdx][chIdx][activeEndIdx] || 0;
      };

      return {
        sel,
        simMap,
        matchedEndIdx: simResult ? simResult.matchedEndIdx : -1,
        activeEndIdx,
        activeChoice,
        activeEpIdx,
        isAllEndingMode,
        isChoiceReachesActiveEnd,
        getChoiceActiveEndCount
      };
    }

    function bezierVertPath(x1, y1, x2, y2, ratio = 0.5) {
      const dy = (y2 - y1) * ratio;
      return `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${x1.toFixed(1)} ${(y1 + dy).toFixed(1)}, ${x2.toFixed(1)} ${(y2 - dy).toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;
    }

    function renderMindMapSvgHtml(layout, script, focusSet, analysis) {
      const paths = [];
      const rp = layout.rootPos;
      const epCount = layout.epNodes.length;
      const isAllEnd = Boolean(focusSet.isAllEndingMode && focusSet.activeEndIdx >= 0);
      const targetEndIdx = isAllEnd ? focusSet.activeEndIdx : focusSet.matchedEndIdx;
      const matchedEnd = targetEndIdx >= 0 && script.endings ? script.endings[targetEndIdx] : null;
      const activeType = matchedEnd ? (matchedEnd.type || 'triumph') : 'triumph';
      const activeColor = matchedEnd ? getEndingTypeMeta(activeType).color : '#2563EB';
      const activeMarker = matchedEnd ? `marker-end="url(#mm-arrow-${activeType})"` : 'marker-end="url(#mm-arrow-blue)"';
      const activeEndTotal = isAllEnd && analysis && analysis.endingStats && analysis.endingStats[targetEndIdx]
        ? Number(analysis.endingStats[targetEndIdx].count || 0)
        : 0;

      // 1. 根节点下端口 -> 第 1 集上端口（主链起点）
      if (epCount > 0) {
        const ep0 = layout.epNodes[0];
        const d = bezierVertPath(rp.x + rp.w / 2, rp.y + rp.h, ep0.x + ep0.w / 2, ep0.y);
        if (isAllEnd && activeEndTotal === 0) {
          paths.push(`<path d="${d}" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="4 4" />`);
        } else {
          paths.push(`<path d="${d}" fill="none" stroke="${activeColor}" stroke-width="3.4" stroke-opacity="0.96" ${activeMarker} />`);
        }
      }

      // 2. 逐集向下展开与汇聚串联（全部可达模式按链路占比点亮全部有效节点与连线；单线模式仅高亮当前串联主链）
      layout.epNodes.forEach((epN, eIdx) => {
        const epOutBaseX = epN.x + epN.w / 2;
        const epOutY = epN.y + epN.h;
        const epChoices = layout.choiceNodes.filter((cn) => cn.epIdx === eIdx);
        const fanOffsets = [-46, 0, 46];

        epChoices.forEach((chN, cIdx) => {
          const isSim = focusSet.simMap[eIdx] === cIdx;
          const cntToTarget = isAllEnd ? focusSet.getChoiceActiveEndCount(eIdx, cIdx) : 0;
          const weightNorm = (isAllEnd && activeEndTotal > 0) ? Math.min(1, cntToTarget / activeEndTotal) : 0;
          const lit = isAllEnd ? (cntToTarget > 0) : isSim;

          // 分集 -> 本集选项
          const stroke = lit ? activeColor : '#CBD5E1';
          const width = isAllEnd ? (lit ? (2.1 + 2.1 * weightNorm).toFixed(2) : 1.1) : (lit ? 3.4 : 1.3);
          const opacity = isAllEnd ? (lit ? (0.56 + 0.42 * weightNorm).toFixed(2) : 0.14) : (lit ? 0.98 : 0.35);
          const marker = lit ? activeMarker : '';
          const dDown = bezierVertPath(epOutBaseX + (fanOffsets[cIdx] || 0), epOutY, chN.x + chN.w / 2, chN.y);
          paths.push(`<path d="${dDown}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-opacity="${opacity}" ${marker} />`);

          // 若不是最后一集：本集选项 -> 下一集分集（逐集串联）
          if (eIdx < epCount - 1) {
            const nextEp = layout.epNodes[eIdx + 1];
            const dJoin = bezierVertPath(chN.x + chN.w / 2, chN.y + chN.h, nextEp.x + nextEp.w / 2 + (fanOffsets[cIdx] || 0), nextEp.y);
            paths.push(`<path d="${dJoin}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-opacity="${opacity}" ${marker} />`);
          } else {
            // 最后一集选项 -> 结局节点
            const chOutX = chN.x + chN.w / 2;
            const chOutY = chN.y + chN.h;
            const countsRow = (analysis && analysis.choiceEndingCounts[eIdx] && analysis.choiceEndingCounts[eIdx][cIdx]) || [];

            layout.endingNodes.forEach((endN, endIdx) => {
              const cnt = countsRow[endIdx] || 0;
              if (cnt <= 0 && !(chN.choice.targetEndingId && chN.choice.targetEndingId === endN.ending.id)) return;
              const endMeta = getEndingTypeMeta(endN.ending.type);
              const isAllLitEdge = isAllEnd && endIdx === targetEndIdx && cnt > 0;
              const isSimFinalEdge = !isAllEnd && isSim && focusSet.matchedEndIdx === endIdx;
              const isHoverEndEdge = !isAllEnd && focusSet.activeEndIdx === endIdx;

              const endWeight = (isAllLitEdge && activeEndTotal > 0) ? Math.min(1, cnt / activeEndTotal) : 0;
              const fStroke = (isAllLitEdge || isSimFinalEdge || isHoverEndEdge) ? endMeta.color : '#CBD5E1';
              const fW = isAllLitEdge
                ? (2.3 + 2.0 * endWeight).toFixed(2)
                : (isSimFinalEdge ? 3.6 : (isHoverEndEdge ? 1.8 : 1.1));
              const fOp = isAllEnd
                ? (isAllLitEdge ? (0.62 + 0.38 * endWeight).toFixed(2) : 0.12)
                : (isSimFinalEdge ? 1 : (isHoverEndEdge ? 0.55 : 0.25));
              const fDash = (isAllLitEdge || isSimFinalEdge) ? '' : 'stroke-dasharray="4 4"';
              const fMarker = (isAllLitEdge || isSimFinalEdge) ? `marker-end="url(#mm-arrow-${endN.ending.type || 'triumph'})"` : '';

              const slotShift = (cIdx - 1) * 18;
              const dEnd = bezierVertPath(chOutX, chOutY, endN.x + endN.w / 2 + slotShift, endN.y, 0.55);
              paths.push(`<path d="${dEnd}" fill="none" stroke="${fStroke}" stroke-width="${fW}" stroke-opacity="${fOp}" ${fDash} ${fMarker} />`);
            });
          }
        });
      });

      return `
        <svg class="mm-svg-layer" width="${layout.width}" height="${layout.height}" viewBox="0 0 ${layout.width} ${layout.height}">
          <defs>
            <marker id="mm-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
            </marker>
            ${Object.entries(ENDING_TYPE_META).map(([k, m]) => `
              <marker id="mm-arrow-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="${m.color}" />
              </marker>
            `).join('')}
          </defs>
          ${paths.join('')}
        </svg>
      `;
    }

    function renderMindMapCanvasHtml(script, simResult, analysis) {
      const layout = computeMindMapLayout(script);
      const focusSet = computeMindMapFocusSet(script, simResult, analysis);
      const sel = state.mmSelectedNode || { type: 'root' };
      const endings = script.endings || [];

      const rp = layout.rootPos;
      const reachableEndCount = (analysis.endingStats || []).filter((es) => es.count > 0).length;
      const rootHtml = `
        <div class="mm-node mm-node-root ${sel.type === 'root' ? 'is-selected' : ''}" data-node-key="root"
          style="left:${rp.x}px; top:${rp.y}px; width:${rp.w}px; height:${rp.h}px; border-top-color:${escapeHtml(script.coverTheme || '#2563EB')};"
          onclick="adminApp.selectMindMapNode('root')">
          <div style="display:flex; gap:12px; align-items:center;">
            <img src="${escapeHtml(script.coverImage || '/static/art/covers/cover-dragon.jpg')}" style="width:62px;height:82px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;flex-shrink:0;" onerror="this.src='/static/art/covers/cover-dragon.jpg';" />
            <div style="min-width:0; flex:1;">
              <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
                <span class="mm-chip" style="background:#EFF6FF;color:#1D4ED8;">剧本起点</span>
                ${script.recommend ? '<span class="mm-chip" style="background:#FEE2E2;color:#B91C1C;">主推</span>' : ''}
                <span class="mm-chip" style="background:#F1F5F9;color:#334155;">${escapeHtml(script.tag || '爽文短剧')} · 主演：${escapeHtml(script.defaultProtagonist || '主角')}</span>
              </div>
              <div style="font-size:16px;font-weight:800;color:#0F172A;margin-bottom:4px;">《${escapeHtml(script.title || '未命名剧本')}》</div>
              <div style="font-size:12px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                ${escapeHtml(script.subtitle || script.synopsis || '点击编辑剧本基础信息与剧情梗概')}
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
              <span class="mm-chip" style="background:#ECFDF5;color:#047857;">共 ${analysis.totalChains} 条完整链路 · ${reachableEndCount}/${endings.length} 结局可达</span>
              <div style="display:flex;gap:6px;">
                <button class="el-btn el-btn-default" style="padding:3px 9px;font-size:11px;" onclick="event.stopPropagation(); adminApp.addMindMapEpisode()">+ 新增分集</button>
                <button class="el-btn el-btn-primary" style="padding:3px 9px;font-size:11px;" onclick="event.stopPropagation(); adminApp.addMindMapEnding()">+ 新增结局</button>
              </div>
            </div>
          </div>
        </div>
      `;

      const epHtml = layout.epNodes.map((epN) => {
        const isSel = sel.type === 'ep' && sel.epIdx === epN.epIdx;
        const pickedIdx = focusSet.simMap[epN.epIdx];
        const pickedLabel = (epN.ep.choices && epN.ep.choices[pickedIdx] && epN.ep.choices[pickedIdx].label) || 'A';
        return `
          <div class="mm-node mm-node-ep ${isSel ? 'is-selected' : ''}" data-node-key="ep:${epN.epIdx}"
            style="left:${epN.x}px; top:${epN.y}px; width:${epN.w}px; height:${epN.h}px;"
            onclick="adminApp.selectMindMapNode('ep', ${epN.epIdx})">
            <div style="display:flex;gap:10px;align-items:center;height:100%;">
              <img src="${escapeHtml(epN.ep.sceneImage || script.coverImage || '/static/art/covers/cover-dragon.jpg')}" style="width:68px;height:52px;object-fit:cover;border-radius:5px;border:1px solid #cbd5e1;flex-shrink:0;" onerror="this.src='/static/art/covers/cover-dragon.jpg';" />
              <div style="min-width:0;flex:1;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
                  <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                    <span class="mm-chip" style="background:#E0F2FE;color:#0369A1;">第 ${epN.epIdx + 1} 集</span>
                    <strong style="font-size:13.5px;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(epN.ep.title || `第 ${epN.epIdx + 1} 集`)}</strong>
                  </div>
                  <span class="mm-chip" style="background:#DBEAFE;color:#1D4ED8;">当前路线已选：${escapeHtml(pickedLabel)}</span>
                </div>
                <div style="font-size:11.5px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  ${escapeHtml(epN.ep.sceneDesc || '点击编辑本集独白正文与分镜插画')}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      const isAllEnd = Boolean(focusSet.isAllEndingMode && focusSet.activeEndIdx >= 0);
      const targetEndObj = isAllEnd ? endings[focusSet.activeEndIdx] : (simResult && simResult.matchedEnding ? simResult.matchedEnding : null);
      const activeChainMeta = targetEndObj ? getEndingTypeMeta(targetEndObj.type) : { color: '#2563EB', softBg: '#EFF6FF', badgeText: '#1D4ED8' };

      const choiceHtml = layout.choiceNodes.map((chN) => {
        const key = `choice:${chN.epIdx}:${chN.chIdx}`;
        const isSel = sel.type === 'choice' && sel.epIdx === chN.epIdx && sel.chIdx === chN.chIdx;
        const isSimPicked = focusSet.simMap[chN.epIdx] === chN.chIdx;
        const ch = chN.choice;
        const badges = formatChoiceEffectBadges(ch);
        const countsRow = (analysis.choiceEndingCounts[chN.epIdx] && analysis.choiceEndingCounts[chN.epIdx][chN.chIdx]) || [];
        const chTotal = (analysis.choiceTotalCounts[chN.epIdx] && analysis.choiceTotalCounts[chN.epIdx][chN.chIdx]) || 1;

        let reachHintHtml = '';
        let dimmedByEnd = false;
        let isLitChoice = isSimPicked;
        if (focusSet.activeEndIdx >= 0) {
          const targetCnt = countsRow[focusSet.activeEndIdx] || 0;
          const endMeta = getEndingTypeMeta(endings[focusSet.activeEndIdx].type);
          if (targetCnt > 0) {
            reachHintHtml = `<span class="mm-chip" style="background:${endMeta.softBg};color:${endMeta.badgeText};border:1px solid ${endMeta.border};font-size:10px;">达该结局: ${targetCnt}条</span>`;
            if (isAllEnd) isLitChoice = true;
          } else {
            reachHintHtml = `<span class="mm-chip" style="background:#F1F5F9;color:#94A3B8;font-size:10px;">0条可达</span>`;
            dimmedByEnd = true;
            if (isAllEnd) isLitChoice = false;
          }
        } else if (ch.targetEndingId) {
          const directEnd = endings.find((e) => (e.id || e.endingId) === ch.targetEndingId);
          if (directEnd) {
            const dMeta = getEndingTypeMeta(directEnd.type);
            reachHintHtml = `<span class="mm-chip" style="background:${dMeta.softBg};color:${dMeta.badgeText};border:1px solid ${dMeta.border};font-size:10px;">指定:${escapeHtml(directEnd.title)}</span>`;
          }
        }

        // 构建底部 4 色概率分布条
        const probSegs = endings.map((end, eIdx) => {
          const cnt = countsRow[eIdx] || 0;
          if (!cnt) return '';
          const pct = ((cnt / chTotal) * 100).toFixed(1);
          const m = getEndingTypeMeta(end.type);
          return `<div class="mm-prob-seg" style="width:${pct}%;background:${m.color};" title="${escapeHtml(end.title)}: ${cnt}条 (${pct}%)"></div>`;
        }).join('');

        const cardOpacityStyle = dimmedByEnd ? '' : (isLitChoice ? '' : 'opacity:0.68;');
        const labelBg = isLitChoice ? activeChainMeta.color : '#334155';
        const borderCol = isLitChoice ? activeChainMeta.color : '#CBD5E1';
        const cardBg = isLitChoice ? activeChainMeta.softBg : '#FFFFFF';
        return `
          <div class="mm-node mm-node-choice ${isSel ? 'is-selected' : ''} ${isLitChoice ? 'is-sim-hit' : ''} ${dimmedByEnd ? 'is-dimmed' : ''}" data-node-key="${key}"
            style="left:${chN.x}px; top:${chN.y}px; width:${chN.w}px; height:${chN.h}px; border-left-color:${borderCol}; border-color:${borderCol}; background:${cardBg}; ${cardOpacityStyle}"
            onclick="adminApp.selectChoiceAndSim(${chN.epIdx}, ${chN.chIdx})"
            onmouseenter="adminApp.hoverMindMapNode('choice', ${chN.epIdx}, ${chN.chIdx})"
            onmouseleave="adminApp.clearMindMapHover()">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:4px;">
              <div style="display:flex;align-items:center;gap:5px;min-width:0;">
                <span class="mm-chip" style="background:${labelBg};color:#FFF;">${escapeHtml(ch.label || (chN.chIdx===0?'A':(chN.chIdx===1?'B':'C')))}</span>
                <span style="font-size:11px;color:#475569;font-weight:700;white-space:nowrap;">${escapeHtml(ch.styleTag || '经典套路')}</span>
                <span style="font-size:11px;color:#2563EB;font-weight:700;">+${Number(ch.qualityBonus || 15)}分</span>
              </div>
              ${reachHintHtml || `<span class="mm-sim-btn ${isSimPicked ? 'active' : ''}" style="${isSimPicked ? `background:${activeChainMeta.color};border-color:${activeChainMeta.color};` : ''}">${isSimPicked ? '当前路线' : '选此项'}</span>`}
            </div>
            <div style="font-size:13px;font-weight:700;color:#0F172A;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">
              ${escapeHtml(ch.text || '点击输入选项文案')}
            </div>
            <div>
              <div style="display:flex;gap:4px;flex-wrap:wrap;">
                ${badges.map(b => `<span class="mm-chip" style="background:${b.bg};color:${b.color};font-size:10px;">${escapeHtml(b.text)}</span>`).join('')}
              </div>
              <div class="mm-prob-bar">${probSegs}</div>
            </div>
          </div>
        `;
      }).join('');

      const endingHtml = layout.endingNodes.map((endN) => {
        const key = `end:${endN.endIdx}`;
        const end = endN.ending;
        const meta = getEndingTypeMeta(end.type);
        const isSel = sel.type === 'ending' && sel.endIdx === endN.endIdx;
        const isSimMatched = simResult && simResult.matchedEndIdx === endN.endIdx;
        const stat = (analysis.endingStats && analysis.endingStats[endN.endIdx]) || { count: 0, percent: 0 };
        const isUnreachable = stat.count === 0;
        return `
          <div class="mm-node mm-node-ending ${isSel ? 'is-selected' : ''} ${isSimMatched ? 'is-sim-hit' : ''}" data-node-key="${key}"
            style="left:${endN.x}px; top:${endN.y}px; width:${endN.w}px; height:${endN.h}px; border-top-color:${isUnreachable ? '#DC2626' : meta.color}; background:${isSimMatched ? meta.softBg : (isUnreachable ? '#FFF5F5' : '#FFFFFF')};"
            onclick="adminApp.selectMindMapNode('ending', 0, 0, ${endN.endIdx})"
            onmouseenter="adminApp.hoverMindMapNode('ending', 0, 0, ${endN.endIdx})"
            onmouseleave="adminApp.clearMindMapHover()">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
              <span class="mm-chip" style="background:${meta.softBg};color:${meta.badgeText};border:1px solid ${meta.border};">${escapeHtml(meta.label)}</span>
              ${isSimMatched
                ? `<span class="mm-chip" style="background:${meta.color};color:#FFF;">当前路线达成</span>`
                : (isUnreachable ? `<span class="mm-chip mm-badge-warn">不可达</span>` : `<span style="font-size:11px;color:#64748B;">P${Number(end.priority || 0)}</span>`)}
            </div>
            <div style="display:flex;gap:8px;align-items:center;margin:4px 0;">
              <img src="${escapeHtml(end.imageUrl || script.coverImage || '/static/art/covers/cover-dragon.jpg')}" style="width:42px;height:56px;object-fit:cover;border-radius:5px;border:1px solid #cbd5e1;flex-shrink:0;" onerror="this.src='/static/art/covers/cover-dragon.jpg';" />
              <div style="min-width:0;flex:1;">
                <div style="font-size:13.5px;font-weight:800;color:#0F172A;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">
                  ${escapeHtml(end.title || '未命名结局')}
                </div>
                <div style="font-size:11px;color:#475569;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  ${escapeHtml(describeEndingCondition(end))}
                </div>
              </div>
            </div>
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:3px;">
                <span style="color:${isUnreachable ? '#B91C1C' : '#334155'};font-weight:700;">
                  ${isUnreachable ? '可达链路：0 条 (不可达)' : `可达链路：${stat.count} / ${analysis.totalChains} 条 (${stat.percent}%)`}
                </span>
              </div>
              <div class="mm-prob-bar" style="height:7px;">
                <div class="mm-prob-seg" style="width:${stat.percent}%;background:${isUnreachable ? '#DC2626' : meta.color};"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="mm-stage-inner" style="width:${layout.width}px; height:${layout.height}px;">
          ${renderMindMapSvgHtml(layout, script, focusSet, analysis)}
          ${rootHtml}
          ${epHtml}
          ${choiceHtml}
          ${endingHtml}
        </div>
      `;
    }

    function renderEndingChainsBoxHtml(script, endIdx, analysis) {
      const targetEnd = (script.endings || [])[endIdx];
      if (!targetEnd) return '';
      const stat = (analysis.endingStats && analysis.endingStats[endIdx]) || { count: 0, percent: 0, samples: [] };
      const meta = getEndingTypeMeta(targetEnd.type);
      const curPathStr = (state.mmSimPath || []).join(',');
      const isAllMode = state.mmEndingViewMode !== 'single';
      if (stat.count === 0) {
        return `
          <div style="padding:10px;border-radius:6px;background:#FEF2F2;border:1px solid #FCA5A5;color:#B91C1C;font-size:12px;line-height:1.5;">
            当前所有 ${analysis.totalChains} 条完整组合链路中，没有一条能走到该结局。请调低此结局的触发门槛，或调整前序分集选项的五维加分，或在某个分支中勾选「指定直达该结局」。
          </div>
        `;
      }
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
          <div style="font-size:12px;color:#334155;">
            共 <strong>${analysis.totalChains}</strong> 条${analysis.isExact ? '' : '采样'}链路，其中 <strong style="color:${meta.badgeText};">${stat.count} 条 (${stat.percent}%)</strong> 可达：
          </div>
          <div style="display:flex;gap:4px;align-items:center;">
            <button class="el-btn ${isAllMode ? 'el-btn-primary' : 'el-btn-default'}" style="padding:2px 8px;font-size:11px;" onclick="adminApp.setEndingViewMode('all', ${endIdx})">全部可达链路</button>
            <button class="el-btn ${!isAllMode ? 'el-btn-primary' : 'el-btn-default'}" style="padding:2px 8px;font-size:11px;" onclick="adminApp.setEndingViewMode('single', ${endIdx})">单条路线预览</button>
            ${stat.samples.length > 1 ? `<button class="el-btn el-btn-default" style="padding:2px 8px;font-size:11px;" onclick="adminApp.cycleEndingSample(${endIdx})">换一条</button>` : ''}
          </div>
        </div>
        ${stat.samples.map((sp) => {
          const isAct = !isAllMode && sp.path.join(',') === curPathStr;
          return `
            <div class="mm-chain-item ${isAct ? 'is-active' : ''}" onclick="adminApp.previewChainPath([${sp.path.join(',')}], ${endIdx})">
              <span>${escapeHtml(sp.codeStr)}</span>
              <span style="font-size:11px;color:#64748B;">搜证${sp.stats.evidence} / 拆${sp.stats.subversion} / 怒${sp.stats.anger}</span>
            </div>
          `;
        }).join('')}
      `;
    }

    function renderChoiceDistBoxHtml(script, epIdx, chIdx, analysis) {
      const endings = script.endings || [];
      const countsRow = (analysis.choiceEndingCounts[epIdx] && analysis.choiceEndingCounts[epIdx][chIdx]) || [];
      const total = (analysis.choiceTotalCounts[epIdx] && analysis.choiceTotalCounts[epIdx][chIdx]) || 0;
      const samplesRow = (analysis.choiceEndingSample[epIdx] && analysis.choiceEndingSample[epIdx][chIdx]) || [];
      if (!total) return '<div style="font-size:12px;color:#94A3B8;">暂无后续链路统计</div>';
      return endings.map((end, eIdx) => {
        const cnt = countsRow[eIdx] || 0;
        const pct = ((cnt / total) * 100).toFixed(1);
        const m = getEndingTypeMeta(end.type);
        const samplePath = samplesRow[eIdx];
        return `
          <div class="mm-chain-item" style="opacity:${cnt > 0 ? 1 : 0.45}; cursor:${samplePath ? 'pointer' : 'default'};"
            onclick="${samplePath ? `adminApp.previewChoiceToEnding(${epIdx}, ${chIdx}, [${samplePath.join(',')}])` : ''}">
            <div style="display:flex;align-items:center;gap:6px;min-width:0;">
              <span style="width:8px;height:8px;border-radius:50%;background:${m.color};flex-shrink:0;"></span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(end.title)}</span>
            </div>
            <span style="font-weight:700;color:${cnt > 0 ? m.badgeText : '#94A3B8'};white-space:nowrap;">
              ${cnt} / ${total} 条 (${pct}%)
            </span>
          </div>
        `;
      }).join('');
    }

    function renderMindMapInspectorHtml(script, simResult, analysis) {
      const sel = state.mmSelectedNode || { type: 'root' };
      const endings = script.endings || [];

      if (sel.type === 'root') {
        return {
          title: '剧本总览属性',
          badge: '根节点',
          body: `
            <div class="mm-field">
              <label>剧本标题 *</label>
              <input class="el-input" value="${escapeHtml(script.title || '')}" oninput="adminApp.updateRootField('title', this.value)" placeholder="请输入剧本标题" />
            </div>
            <div class="mm-field">
              <label>副标题 / 宣传语</label>
              <input class="el-input" value="${escapeHtml(script.subtitle || '')}" oninput="adminApp.updateRootField('subtitle', this.value)" placeholder="例如：三年之期已到，恭迎龙王！" />
            </div>
            <div class="mm-grid-2">
              <div class="mm-field">
                <label>题材标签</label>
                <input class="el-input" value="${escapeHtml(script.tag || '')}" oninput="adminApp.updateRootField('tag', this.value)" />
              </div>
              <div class="mm-field">
                <label>默认主角名</label>
                <input class="el-input" value="${escapeHtml(script.defaultProtagonist || '')}" oninput="adminApp.updateRootField('defaultProtagonist', this.value)" />
              </div>
            </div>
            <div class="mm-grid-2">
              <div class="mm-field">
                <label>首页主推状态</label>
                <select class="el-select" style="width:100%;" onchange="adminApp.updateRootField('recommend', this.value === '1')">
                  <option value="1" ${script.recommend ? 'selected' : ''}>主推剧本（置顶展示）</option>
                  <option value="0" ${!script.recommend ? 'selected' : ''}>普通剧本</option>
                </select>
              </div>
              <div class="mm-field">
                <label>波普主题配色</label>
                <div style="display:flex;gap:6px;align-items:center;">
                  <input id="mm-root-theme" class="el-input" value="${escapeHtml(script.coverTheme || '#FFE600')}" oninput="adminApp.updateRootField('coverTheme', this.value)" />
                </div>
              </div>
            </div>
            <div class="mm-field">
              <label>封面图片路径 / URL</label>
              <div style="display:flex;gap:8px;align-items:center;">
                <img id="mm-root-cover-prev" src="${escapeHtml(script.coverImage || '/static/art/covers/cover-dragon.jpg')}" style="width:46px;height:62px;object-fit:cover;border-radius:4px;border:1px solid #cbd5e1;" onerror="this.src='/static/art/covers/cover-dragon.jpg';" />
                <div style="flex:1;">
                  <input id="mm-root-cover-input" class="el-input" value="${escapeHtml(script.coverImage || '')}" oninput="document.getElementById('mm-root-cover-prev').src=this.value; adminApp.updateRootField('coverImage', this.value)" />
                  <div style="margin-top:4px;font-size:11px;color:#64748B;">
                    预设：
                    <a href="javascript:;" onclick="adminApp.setRootCoverPreset('/static/art/covers/cover-dragon.jpg')">龙王</a> ·
                    <a href="javascript:;" onclick="adminApp.setRootCoverPreset('/static/art/covers/cover-heiress.jpg')">千金</a> ·
                    <a href="javascript:;" onclick="adminApp.setRootCoverPreset('/static/art/covers/cover-marriage.jpg')">闪婚</a> ·
                    <a href="javascript:;" onclick="adminApp.setRootCoverPreset('/static/art/covers/cover-reborn.jpg')">复仇</a> ·
                    <a href="javascript:;" onclick="adminApp.setRootCoverPreset('/static/art/covers/cover-palace.jpg')">宫斗</a>
                  </div>
                </div>
              </div>
            </div>
            <div class="mm-field">
              <label>首屏剧情梗概（开拍前情提要）</label>
              <textarea class="el-textarea" rows="4" oninput="adminApp.updateRootField('synopsis', this.value)">${escapeHtml(script.synopsis || '')}</textarea>
            </div>
            <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:10px;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:12px;color:#475569;">当前结构：<strong>${(script.episodes||[]).length}</strong> 集 / <strong>${endings.length}</strong> 结局</span>
              <div style="display:flex;gap:6px;">
                <button class="el-btn el-btn-default" style="padding:4px 8px;font-size:12px;" onclick="adminApp.addMindMapEpisode()">+ 加一集</button>
                <button class="el-btn el-btn-primary" style="padding:4px 8px;font-size:12px;" onclick="adminApp.addMindMapEnding()">+ 加结局</button>
              </div>
            </div>
          `
        };
      }

      if (sel.type === 'ep') {
        const epIdx = sel.epIdx;
        const ep = (script.episodes || [])[epIdx];
        if (!ep) return { title: '分集详情', badge: '分集节点', body: '<div style="color:#94A3B8;">分集不存在</div>' };
        return {
          title: `第 ${epIdx + 1} 集剧本配置`,
          badge: `第 ${epIdx + 1} 集节点`,
          body: `
            <div class="mm-field">
              <label>分集标题</label>
              <input class="el-input" value="${escapeHtml(ep.title || '')}" oninput="adminApp.updateEpField(${epIdx}, 'title', this.value)" />
            </div>
            <div class="mm-field">
              <label>分镜插画路径 / URL</label>
              <div style="display:flex;gap:8px;align-items:center;">
                <img id="mm-ep-img-prev" src="${escapeHtml(ep.sceneImage || script.coverImage || '/static/art/covers/cover-dragon.jpg')}" style="width:54px;height:40px;object-fit:cover;border-radius:4px;border:1px solid #cbd5e1;" onerror="this.src='/static/art/covers/cover-dragon.jpg';" />
                <input class="el-input" style="flex:1;" value="${escapeHtml(ep.sceneImage || '')}" oninput="document.getElementById('mm-ep-img-prev').src=this.value; adminApp.updateEpField(${epIdx}, 'sceneImage', this.value)" />
              </div>
            </div>
            <div class="mm-field">
              <label>独白与场景正文（支持 {{playerName}} 动态主演名）</label>
              <textarea class="el-textarea" rows="7" oninput="adminApp.updateEpField(${epIdx}, 'sceneDesc', this.value)">${escapeHtml(ep.sceneDesc || '')}</textarea>
            </div>
            <div class="mm-field">
              <label>本集 3 选 1 节点快速跳转</label>
              <div style="display:flex;flex-direction:column;gap:6px;">
                ${(ep.choices || []).map((ch, cIdx) => {
                  const countsRow = (analysis.choiceEndingCounts[epIdx] && analysis.choiceEndingCounts[epIdx][cIdx]) || [];
                  let topIdx = 0;
                  countsRow.forEach((cnt, i) => { if (cnt > (countsRow[topIdx] || 0)) topIdx = i; });
                  const topEnd = endings[topIdx];
                  const meta = topEnd ? getEndingTypeMeta(topEnd.type) : ENDING_TYPE_META.triumph;
                  return `
                    <div onclick="adminApp.selectChoiceAndSim(${epIdx}, ${cIdx})" style="padding:8px 10px;border:1px solid #CBD5E1;border-left:4px solid ${meta.color};border-radius:6px;cursor:pointer;background:#F8FAFC;display:flex;justify-content:space-between;align-items:center;gap:8px;">
                      <span style="font-size:12px;font-weight:700;color:#0F172A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ch.label)}. ${escapeHtml(ch.text || '')}</span>
                      <span class="mm-chip" style="background:${meta.softBg};color:${meta.badgeText};font-size:10px;">主向:${escapeHtml(topEnd ? topEnd.title : '')}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            ${(script.episodes || []).length > 1 ? `
              <div style="margin-top:16px;padding-top:12px;border-top:1px solid #E2E8F0;display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:12px;color:#64748B;">删除后其余分集将自动顺延编号</span>
                <button class="el-btn el-btn-danger" onclick="adminApp.removeMindMapEpisode(${epIdx})">删除第 ${epIdx + 1} 集</button>
              </div>
            ` : ''}
          `
        };
      }

      if (sel.type === 'choice') {
        const epIdx = sel.epIdx;
        const chIdx = sel.chIdx;
        const ep = (script.episodes || [])[epIdx];
        const ch = ep && (ep.choices || [])[chIdx];
        if (!ch) return { title: '选项节点详情', badge: '分支节点', body: '<div style="color:#94A3B8;">选项不存在</div>' };
        const eff = ch.effects || {};
        return {
          title: `第 ${epIdx + 1} 集 · 选项 ${escapeHtml(ch.label)}`,
          badge: '分支选项节点',
          body: `
            <div class="mm-field">
              <label>选项按钮文案 *</label>
              <input class="el-input" value="${escapeHtml(ch.text || '')}" oninput="adminApp.updateChoiceField(${epIdx}, ${chIdx}, 'text', this.value)" />
            </div>
            <div class="mm-grid-2">
              <div class="mm-field">
                <label>流派风格标签</label>
                <select class="el-select" style="width:100%;" onchange="adminApp.updateChoiceField(${epIdx}, ${chIdx}, 'styleTag', this.value)">
                  ${['经典套路', '离谱反套路', '打工人觉醒'].map(tag => `<option value="${tag}" ${ch.styleTag === tag ? 'selected' : ''}>${tag}</option>`).join('')}
                </select>
              </div>
              <div class="mm-field">
                <label>拍摄质量加分</label>
                <input type="number" class="el-input" value="${Number(ch.qualityBonus || 15)}" oninput="adminApp.updateChoiceField(${epIdx}, ${chIdx}, 'qualityBonus', Number(this.value) || 0)" />
              </div>
            </div>
            <div class="mm-field">
              <label>选择后戏剧性反馈（观众/剧情结果）</label>
              <textarea class="el-textarea" rows="4" oninput="adminApp.updateChoiceField(${epIdx}, ${chIdx}, 'feedback', this.value)">${escapeHtml(ch.feedback || ch.outcome || '')}</textarea>
            </div>
            <div class="mm-field">
              <label>五维剧情数值影响（实时重算全剧 729 条链路）</label>
              <div class="mm-grid-5">
                <div class="mm-stat-box">
                  <label>爽点</label>
                  <input type="number" class="el-input" value="${Number(eff.pleasure || 0)}" oninput="adminApp.updateChoiceEffect(${epIdx}, ${chIdx}, 'pleasure', this.value)" />
                </div>
                <div class="mm-stat-box">
                  <label>戏剧</label>
                  <input type="number" class="el-input" value="${Number(eff.drama || 0)}" oninput="adminApp.updateChoiceEffect(${epIdx}, ${chIdx}, 'drama', this.value)" />
                </div>
                <div class="mm-stat-box">
                  <label>怒气</label>
                  <input type="number" class="el-input" value="${Number(eff.anger || 0)}" oninput="adminApp.updateChoiceEffect(${epIdx}, ${chIdx}, 'anger', this.value)" />
                </div>
                <div class="mm-stat-box">
                  <label>搜证</label>
                  <input type="number" class="el-input" value="${Number(eff.evidence || 0)}" oninput="adminApp.updateChoiceEffect(${epIdx}, ${chIdx}, 'evidence', this.value)" />
                </div>
                <div class="mm-stat-box">
                  <label>拆套路</label>
                  <input type="number" class="el-input" value="${Number(eff.subversion || 0)}" oninput="adminApp.updateChoiceEffect(${epIdx}, ${chIdx}, 'subversion', this.value)" />
                </div>
              </div>
            </div>
            <div class="mm-field">
              <label>结局走向覆盖（可选：默认由6集累积数值共同决定）</label>
              <select class="el-select" style="width:100%;" onchange="adminApp.updateChoiceField(${epIdx}, ${chIdx}, 'targetEndingId', this.value)">
                <option value="" ${!ch.targetEndingId ? 'selected' : ''}>按 6 集累积五维数值共同决定结局（推荐）</option>
                ${endings.map((end) => `
                  <option value="${escapeHtml(end.id)}" ${ch.targetEndingId === end.id ? 'selected' : ''}>
                    指定直达：${escapeHtml(end.title)}（${escapeHtml(getEndingTypeMeta(end.type).label)}）
                  </option>
                `).join('')}
              </select>
            </div>
            <div class="mm-field">
              <label>选择此节点后各结局可达分布（点击可演示整条串联链路）</label>
              <div id="mm-choice-dist-box">${renderChoiceDistBoxHtml(script, epIdx, chIdx, analysis)}</div>
            </div>
            <div style="padding-top:10px;border-top:1px solid #E2E8F0;display:flex;justify-content:space-between;align-items:center;">
              <button class="el-btn el-btn-default" onclick="adminApp.selectMindMapNode('ep', ${epIdx})">返回第 ${epIdx + 1} 集</button>
            </div>
          `
        };
      }

      if (sel.type === 'ending') {
        const endIdx = sel.endIdx;
        const end = endings[endIdx];
        if (!end) return { title: '结局详情', badge: '结局节点', body: '<div style="color:#94A3B8;">结局不存在</div>' };
        const cond = end.condition || {};
        let condMode = 'auto';
        if (cond.always || cond.default) condMode = 'always';
        else if (cond.minStats && Number(cond.minStats.evidence || 0) >= 4 && cond.maxStats && cond.maxStats.anger !== undefined) condMode = 'hidden_strict';
        else if ((Array.isArray(cond.allFlags) && cond.allFlags.length) || (cond.minStats && Number(cond.minStats.evidence || 0) >= 3 && !cond.maxStats)) condMode = 'evidence3';
        else if (cond.minStats && cond.minStats.subversion && Object.keys(cond.minStats).length === 1 && !cond.maxStats) condMode = 'subversion3';
        else if (cond.minStats && Number(cond.minStats.anger || 0) === 60 && cond.maxStats && Number(cond.maxStats.evidence) === 2) condMode = 'unfinished_60';
        else if (cond.minStats && Number(cond.minStats.anger || 0) >= 85 && cond.maxStats && Number(cond.maxStats.evidence) <= 1) condMode = 'anger85';

        return {
          title: `结局：${escapeHtml(end.title || '未命名结局')}`,
          badge: getEndingTypeMeta(end.type).label,
          body: `
            <div class="mm-field">
              <label>可达链路高亮（默认展示全部可达分支，也可切换单条路线预览）</label>
              <div id="mm-ending-chains-box">${renderEndingChainsBoxHtml(script, endIdx, analysis)}</div>
            </div>
            <div class="mm-field">
              <label>结局标题 *</label>
              <input class="el-input" value="${escapeHtml(end.title || '')}" oninput="adminApp.updateEndingField(${endIdx}, 'title', this.value)" />
            </div>
            <div class="mm-grid-2">
              <div class="mm-field">
                <label>结局类型</label>
                <select class="el-select" style="width:100%;" onchange="adminApp.updateEndingField(${endIdx}, 'type', this.value)">
                  <option value="hidden" ${end.type === 'hidden' ? 'selected' : ''}>隐藏彩蛋 (红)</option>
                  <option value="subversive" ${end.type === 'subversive' ? 'selected' : ''}>反套路收官 (绿)</option>
                  <option value="unfinished" ${end.type === 'unfinished' ? 'selected' : ''}>喜剧烂尾 (橙)</option>
                  <option value="triumph" ${end.type === 'triumph' ? 'selected' : ''}>爽剧完结 (蓝)</option>
                </select>
              </div>
              <div class="mm-field">
                <label>判定优先级（越大越优先）</label>
                <input type="number" class="el-input" value="${Number(end.priority || 70)}" oninput="adminApp.updateEndingField(${endIdx}, 'priority', Number(this.value) || 0)" />
              </div>
            </div>
            <div class="mm-field">
              <label>触发条件规则</label>
              <select class="el-select" style="width:100%;" onchange="adminApp.updateEndingCondPreset(${endIdx}, this.value)">
                <option value="always" ${condMode === 'always' ? 'selected' : ''}>默认保底完结（无前置门槛）</option>
                <option value="hidden_strict" ${condMode === 'hidden_strict' ? 'selected' : ''}>隐藏彩蛋严选（材料 >= 4 且怒气 <= 42）</option>
                <option value="evidence3" ${condMode === 'evidence3' ? 'selected' : ''}>搜证材料累计 >= 3 触发</option>
                <option value="subversion3" ${condMode === 'subversion3' ? 'selected' : ''}>拆套路累计 >= 3 触发</option>
                <option value="unfinished_60" ${condMode === 'unfinished_60' ? 'selected' : ''}>喜剧烂尾标准（怒气 >= 60 且材料 <= 2）</option>
                <option value="anger85" ${condMode === 'anger85' ? 'selected' : ''}>极端怒气爆表（怒气 >= 85 且材料 <= 1）</option>
                <option value="auto" ${condMode === 'auto' ? 'selected' : ''}>自定义条件 / 仅通过选项指定直达</option>
              </select>
            </div>
            <div class="mm-field">
              <label>结局插画路径 / URL</label>
              <div style="display:flex;gap:8px;align-items:center;">
                <img id="mm-end-img-prev" src="${escapeHtml(end.imageUrl || script.coverImage || '/static/art/covers/cover-dragon.jpg')}" style="width:46px;height:62px;object-fit:cover;border-radius:4px;border:1px solid #cbd5e1;" onerror="this.src='/static/art/covers/cover-dragon.jpg';" />
                <input class="el-input" style="flex:1;" value="${escapeHtml(end.imageUrl || '')}" oninput="document.getElementById('mm-end-img-prev').src=this.value; adminApp.updateEndingField(${endIdx}, 'imageUrl', this.value)" />
              </div>
            </div>
            <div class="mm-field">
              <label>图鉴未解锁线索提示</label>
              <input class="el-input" value="${escapeHtml(end.hint || '')}" oninput="adminApp.updateEndingField(${endIdx}, 'hint', this.value)" />
            </div>
            <div class="mm-field">
              <label>结局正文剧情</label>
              <textarea class="el-textarea" rows="4" oninput="adminApp.updateEndingField(${endIdx}, 'text', this.value)">${escapeHtml(end.text || '')}</textarea>
            </div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid #E2E8F0;display:flex;justify-content:space-between;align-items:center;">
              <button class="el-btn el-btn-primary" onclick="adminApp.addMindMapEnding()">+ 新增结局节点</button>
              ${endings.length > 1 ? `<button class="el-btn el-btn-danger" onclick="adminApp.removeMindMapEnding(${endIdx})">删除此结局</button>` : ''}
            </div>
          `
        };
      }
      return { title: '节点详情', badge: '', body: '' };
    }

    function renderMindMapSimSummaryHtml(simResult) {
      const s = simResult.stats || {};
      const endTitle = simResult.matchedEnding ? simResult.matchedEnding.title : '未匹配';
      const endMeta = simResult.matchedEnding ? getEndingTypeMeta(simResult.matchedEnding.type) : ENDING_TYPE_META.triumph;
      const pathCode = (simResult.simChoices || []).map((sc) => `${sc.epIdx + 1}${(sc.choice && sc.choice.label) || ''}`).join(' -> ');
      return `
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span style="font-weight:700;color:#0F172A;">当前串联 (${escapeHtml(pathCode)})：</span>
          <span class="mm-chip" style="background:#DBEAFE;color:#1D4ED8;">爽点 ${s.pleasure || 0}</span>
          <span class="mm-chip" style="background:#EDE9FE;color:#6D28D9;">戏剧 ${s.drama || 0}</span>
          <span class="mm-chip" style="background:#FEE2E2;color:#B91C1C;">怒气 ${s.anger || 0}</span>
          <span class="mm-chip" style="background:#FEF3C7;color:#B45309;">搜证 ${s.evidence || 0}</span>
          <span class="mm-chip" style="background:#DCFCE7;color:#15803D;">拆套路 ${s.subversion || 0}</span>
          <span style="color:#64748B;">-></span>
          <span class="mm-chip" style="background:${endMeta.color};color:#FFF;padding:3px 10px;">
            结局：${escapeHtml(endTitle)}（${escapeHtml(simResult.routeReason || '')}）
          </span>
        </div>
      `;
    }

    const TITLE_MAP = {
      'sys-user': '系统管理 / 用户管理',
      'sys-role': '系统管理 / 角色管理',
      dashboard: '漫剧大导演管理 / 运营数据看板与选项漏斗',
      script: '漫剧大导演管理 / 剧本可视化配置与热更新工厂',
      'player-user': '漫剧大导演管理 / 导演玩家用户管理',
      collection: '漫剧大导演管理 / 全剧本图鉴与彩蛋管理',
      leaderboard: '漫剧大导演管理 / 封神排行榜管理与防作弊风控',
      record: '漫剧大导演管理 / 玩家拍摄杀青流水监控',
      progress: '漫剧大导演管理 / 全服导演各剧本拍摄档期与集数进度监控',
      config: '漫剧大导演管理 / 微信提审纯净模式、激励广告与敏感词风控'
    };

    window.adminApp = {
      // 1. 认证与登录
      async doLogin() {
        const u = document.getElementById('login-username').value.trim();
        const p = document.getElementById('login-password').value;
        const code = document.getElementById('login-code').value.trim();
        if (!u) {
          notify('请输入管理员账号', true);
          return;
        }
        if (!p) {
          notify('请输入管理员密码', true);
          return;
        }
        if (!code || state.captchaAnswer === null || Number(code) !== state.captchaAnswer) {
          notify('安全验证码错误，请重新输入', true);
          this.refreshCaptcha();
          return;
        }

        const rememberMe = document.getElementById('login-remember-me').checked;
        const btn = document.getElementById('btn-login-submit');
        btn.innerText = '正在验证登录...';
        btn.disabled = true;

        try {
          const res = await fetch(`${API_BASE}/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userName: u, password: p })
          });
          const json = await res.json();
          if (json.code === 200 && json.token) {
            state.token = json.token;
            localStorage.setItem('Admin-Token', state.token);
            if (rememberMe) {
              localStorage.setItem('Admin-Remember-Username', u);
            } else {
              localStorage.removeItem('Admin-Remember-Username');
            }
            if (json.user) state.currentUser = json.user;
            notify('登录成功，欢迎进入管理后台！');
            this.enterWorkbench();
          } else {
            this.refreshCaptcha();
            notify(json.msg || '账号或密码错误', true);
          }
        } catch (e) {
          this.refreshCaptcha();
          notify('连接服务端失败: ' + e.message, true);
        } finally {
          btn.innerText = '登 录';
          btn.disabled = false;
        }
      },

      // 2. 退出登录
      async doLogout() {
        try {
          await fetch(`${API_BASE}/logout`, { method: 'POST' });
        } catch(e) {}
        localStorage.removeItem('Admin-Token');
        state.token = '';
        notify('您已安全退出管理后台');
        this.showLogin();
      },

      showLogin() {
        document.getElementById('login-view').style.display = 'flex';
        document.getElementById('layout-view').style.display = 'none';
        const savedUser = localStorage.getItem('Admin-Remember-Username') || '';
        const uEl = document.getElementById('login-username');
        const pEl = document.getElementById('login-password');
        const rEl = document.getElementById('login-remember-me');
        if (uEl) uEl.value = savedUser;
        if (pEl) pEl.value = '';
        if (rEl) rEl.checked = Boolean(savedUser);
        this.refreshCaptcha();
      },

      async enterWorkbench() {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('layout-view').style.display = 'flex';
        document.getElementById('current-user-nick').textContent = state.currentUser.nickName || '超级管理员';
        try {
          const infoRes = await fetch(`${API_BASE}/getInfo`);
          if (infoRes.ok) {
            const infoJson = await infoRes.json();
            if (infoJson.code === 200 && infoJson.user) {
              state.currentUser = infoJson.user;
              document.getElementById('current-user-nick').textContent = infoJson.user.nickName || infoJson.user.userName || '超级管理员';
            }
          }
        } catch (e) {}
        this.switchTab('dashboard');
      },

      refreshCaptcha() {
        const a = Math.floor(Math.random() * 10) + 1;
        const b = Math.floor(Math.random() * 10) + 1;
        state.captchaAnswer = a + b;
        const codeTextEl = document.getElementById('login-captcha-code');
        const codeInputEl = document.getElementById('login-code');
        if (codeTextEl) codeTextEl.textContent = `${a} + ${b} = ?`;
        if (codeInputEl) codeInputEl.value = '';
      },

      // 3. 标签与菜单切换
      async switchTab(tab) {
        state.tab = tab;
        document.getElementById('breadcrumb-title').textContent = TITLE_MAP[tab] || tab;
        const allTabs = ['sys-user', 'sys-role', 'dashboard', 'script', 'player-user', 'collection', 'leaderboard', 'record', 'progress', 'config'];
        allTabs.forEach((t) => {
          const navEl = document.getElementById('nav-' + t);
          const tagEl = document.getElementById('tag-' + t);
          if (navEl) navEl.classList.toggle('active', t === tab);
          if (tagEl) tagEl.classList.toggle('active', t === tab);
        });
        await this.loadTabData();
      },

      // 4. 数据加载路由（含统一加载动画）
      async loadTabData() {
        const contentBox = document.getElementById('admin-content');
        if (contentBox) {
          contentBox.innerHTML = `<div class="ry-loading-panel"><span class="ry-spinner"></span><span>数据加载中...</span></div>`;
        }
        if (state.tab === 'sys-user') {
          const res = await fetch(`${API_BASE}/system/user/list`);
          state.sysUsers = (await res.json()).rows || [];
        } else if (state.tab === 'player-user') {
          let q = '';
          if (state.playerFilterNickname) q += `?nickname=${encodeURIComponent(state.playerFilterNickname)}`;
          if (state.playerFilterStatus) q += (q ? '&' : '?') + `status=${state.playerFilterStatus}`;
          const res = await fetch(`${API_BASE}/duanju/user/list${q}`);
          state.playerUsers = (await res.json()).rows || [];
        } else if (state.tab === 'dashboard') {
          const res = await fetch(`${API_BASE}/duanju/dashboard/stats?scriptId=${state.dashboardScriptId}`);
          const json = await res.json();
          state.dashboardData = json.data;
          const sRes = await fetch(`${API_BASE}/duanju/script/list`);
          state.scripts = (await sRes.json()).rows || [];
        } else if (state.tab === 'script') {
          const res = await fetch(`${API_BASE}/duanju/script/list`);
          state.scripts = (await res.json()).rows || [];
        } else if (state.tab === 'collection') {
          const q = state.collectionScriptFilter ? `?scriptId=${encodeURIComponent(state.collectionScriptFilter)}` : '';
          const res = await fetch(`${API_BASE}/duanju/collection/list${q}`);
          const data = await res.json();
          state.collections = data.rows || [];
          state.collectionScripts = data.scripts || [];
        } else if (state.tab === 'leaderboard') {
          const [lbRes, sRes] = await Promise.all([
            fetch(`${API_BASE}/duanju/leaderboard/list${state.leaderboardScriptFilter ? `?scriptId=${encodeURIComponent(state.leaderboardScriptFilter)}` : ''}`),
            fetch(`${API_BASE}/duanju/script/list`)
          ]);
          state.leaderboards = (await lbRes.json()).rows || [];
          state.scripts = (await sRes.json()).rows || [];
        } else if (state.tab === 'record') {
          const [rRes, sRes] = await Promise.all([
            fetch(`${API_BASE}/duanju/record/list`),
            fetch(`${API_BASE}/duanju/script/list`)
          ]);
          state.records = (await rRes.json()).rows || [];
          state.scripts = (await sRes.json()).rows || [];
        } else if (state.tab === 'progress') {
          const [pRes, sRes] = await Promise.all([
            fetch(`${API_BASE}/duanju/progress/admin/list`),
            fetch(`${API_BASE}/duanju/script/list`)
          ]);
          state.progressList = (await pRes.json()).rows || [];
          state.scripts = (await sRes.json()).rows || [];
        } else if (state.tab === 'config') {
          const res = await fetch(`${API_BASE}/duanju/config`);
          state.config = (await res.json()).data || state.config;
        }
        renderAdmin();
      },

      // 5. 系统用户管理操作
      openAddUserModal() {
        document.getElementById('new-user-name').value = '';
        document.getElementById('new-user-nick').value = '';
        document.getElementById('new-user-password').value = '';
        document.getElementById('new-user-dept').value = '短剧业务运营部';
        document.getElementById('new-user-phone').value = '';
        document.getElementById('add-user-modal').style.display = 'flex';
      },

      async submitNewSysUser() {
        const userName = document.getElementById('new-user-name').value.trim();
        const nickName = document.getElementById('new-user-nick').value.trim();
        const password = document.getElementById('new-user-password').value;
        const deptName = document.getElementById('new-user-dept').value.trim();
        const phonenumber = document.getElementById('new-user-phone').value.trim();
        const roleName = document.getElementById('new-user-role').value;
        if (!userName || !nickName || !password) {
          notify('账号、昵称和初始密码不能为空', true);
          return;
        }
        if (password.length < 6 || password.length > 32) {
          notify('登录密码长度需为6-32位', true);
          return;
        }
        const res = await fetch(`${API_BASE}/system/user`, {

        state.mmEndingViewMode = 'single';
        const curStr = (state.mmSimPath || []).join(',');
        const curIdx = samples.findIndex((sp) => sp.path.join(',') === curStr);
        const nextIdx = (curIdx + 1) % samples.length;
